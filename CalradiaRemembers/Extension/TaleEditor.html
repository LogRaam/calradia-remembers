<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tale Editor</title>
<style id="tale-editor-style">
/*STYLE*/
</style>
</head>
<body>
<!--BODY-->
<script id="quest-schema" type="application/json">
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://calradia-remembers/quest.schema.json",
  "title": "Calradia Remembers: a written tale",
  "description": "GENERATED from CalradiaRemembers.Logic.AuthoredQuests by the Maps suite (QuestSchemaMap). Do not edit: regenerate with Tools/Update-Maps.ps1. A file holds one tale, or a list of tales.",
  "oneOf": [
    {
      "$ref": "#/$defs/AuthoredQuest"
    },
    {
      "type": "array",
      "items": {
        "$ref": "#/$defs/AuthoredQuest"
      }
    }
  ],
  "x-lists": {
    "ObjectiveTypes": [
      "talk_to",
      "talk_to_locals",
      "be_at",
      "keep_watch",
      "explore",
      "defeat_party",
      "return",
      "wait"
    ],
    "ChoiceObjectiveTypes": [
      "talk_to",
      "return",
      "talk_to_locals",
      "be_at",
      "defeat_party",
      "wait"
    ],
    "HazardEffects": [
      "injure",
      "alert",
      "lose_time"
    ],
    "ConsequenceTypes": [
      "memory",
      "world_event"
    ],
    "GiverRoles": [
      "lord",
      "notable",
      "gang_leader",
      "any"
    ],
    "RivalRoles": [
      "clan_leader"
    ],
    "SpeakingRoles": [
      "{giver}",
      "{rival}"
    ]
  },
  "$defs": {
    "AuthoredQuest": {
      "type": [
        "object",
        "null"
      ],
      "description": "One authored quest, as its file describes it.",
      "properties": {
        "id": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "Unique across every file. Prefix it with your mod's name."
        },
        "title": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "Shown in the journal as \"Tale: <title>\"."
        },
        "author": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "Who wrote it. Shown to nobody in game; for the reader of the file."
        },
        "unique": {
          "type": "boolean",
          "x-kind": "bool",
          "description": "On (the default): played once per campaign, won or lost. Off: it may come back.",
          "default": true
        },
        "repeat_cooldown_days": {
          "type": "integer",
          "x-kind": "int",
          "description": "For a tale that is not unique: how many days after it ended before it may be offered again.",
          "default": 0
        },
        "weight": {
          "type": "integer",
          "x-kind": "int",
          "description": "When a character could give several tales, they are chosen in proportion to their weights. 0 is never offered. Default 10.",
          "default": 10
        },
        "requires": {
          "$ref": "#/$defs/AuthoredRequires",
          "x-kind": "object:AuthoredRequires",
          "description": "Who may give the tale, and what it needs of the world and of the player.",
          "x-default-empty": true
        },
        "binds": {
          "type": [
            "object",
            "null"
          ],
          "additionalProperties": {
            "type": [
              "string",
              "null"
            ]
          },
          "x-kind": "map:string",
          "description": "Every role your text uses, with a short description for the reader of the file. Each {role} is filled with a real name.",
          "x-default-empty": true
        },
        "stages": {
          "type": [
            "array",
            "null"
          ],
          "items": {
            "$ref": "#/$defs/AuthoredStage"
          },
          "x-kind": "object:AuthoredStage[]",
          "description": "The steps of the story, the first being the request itself.",
          "x-default-empty": true
        },
        "reward": {
          "$ref": "#/$defs/AuthoredOutcome",
          "x-kind": "object:AuthoredOutcome",
          "description": "The single success ending: what the tale leaves when a path leads to \"reward\".",
          "x-default-empty": true
        },
        "endings": {
          "type": [
            "object",
            "null"
          ],
          "additionalProperties": {
            "$ref": "#/$defs/AuthoredOutcome"
          },
          "x-kind": "map:object:AuthoredOutcome",
          "description": "Named endings, each with its own regard, gold, memory and consequences. A path leads to one with \"end:<id>\".",
          "x-default-empty": true
        },
        "failure": {
          "$ref": "#/$defs/AuthoredOutcome",
          "x-kind": "object:AuthoredOutcome",
          "description": "What the tale leaves when its time runs out (days) before any ending is reached.",
          "x-default-empty": true
        }
      }
    },
    "AuthoredRequires": {
      "type": [
        "object",
        "null"
      ],
      "description": "When the quest may be offered, and by whom (increment 1: the shape the werewolf needs).",
      "properties": {
        "giver": {
          "$ref": "#/$defs/GiverRequirement",
          "x-kind": "object:GiverRequirement",
          "description": "The character who gives the tale.",
          "x-default-empty": true
        },
        "village": {
          "$ref": "#/$defs/PlaceRequirement",
          "x-kind": "object:PlaceRequirement",
          "description": "The village the tale happens in, bound as {village}."
        },
        "rival": {
          "$ref": "#/$defs/RivalRequirement",
          "x-kind": "object:RivalRequirement",
          "description": "A second lord the tale needs, bound as {rival}: the leader of another house of the giver's realm."
        },
        "player": {
          "$ref": "#/$defs/PlayerRequirement",
          "x-kind": "object:PlayerRequirement",
          "description": "What the player must be.",
          "x-default-empty": true
        }
      }
    },
    "AuthoredStage": {
      "type": [
        "object",
        "null"
      ],
      "description": "One stage: a journal line, one verified objective, what the people involved know, and what follows.",
      "properties": {
        "id": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "The stage's name, used by \"next\" to lead here. Unique in the tale."
        },
        "journal": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "The line logged in the quest journal when the stage begins."
        },
        "objective": {
          "$ref": "#/$defs/AuthoredObjective",
          "x-kind": "object:AuthoredObjective",
          "description": "What the game checks to complete the stage. A stage with choices may have none."
        },
        "canvas": {
          "$ref": "#/$defs/lines",
          "x-kind": "lines",
          "description": "How the moment feels. Spoken by the giver, when this stage is theirs to say. A line may hold only under a flag.",
          "x-default-empty": true
        },
        "facts": {
          "type": [
            "array",
            "null"
          ],
          "items": {
            "$ref": "#/$defs/line"
          },
          "x-kind": "line[]",
          "description": "What the giver must convey, without changing it. A fact may hold only under a flag.",
          "x-default-empty": true
        },
        "knowers": {
          "type": [
            "object",
            "null"
          ],
          "additionalProperties": {
            "type": [
              "array",
              "null"
            ],
            "items": {
              "$ref": "#/$defs/line"
            }
          },
          "x-kind": "map:line[]",
          "description": "Lines for other characters, framed as what they believe at this stage. The key is a role (\"{giver}\") or \"locals_of:{place}\".",
          "x-default-empty": true
        },
        "choices": {
          "type": [
            "array",
            "null"
          ],
          "items": {
            "$ref": "#/$defs/AuthoredChoice"
          },
          "x-kind": "object:AuthoredChoice[]",
          "description": "Ways out of this stage: by an act, by the player's choice in a scene, or by words in a conversation. The first taken wins.",
          "x-default-empty": true
        },
        "on_complete": {
          "$ref": "#/$defs/AuthoredOnComplete",
          "x-kind": "object:AuthoredOnComplete",
          "description": "What follows when the stage's own objective is met.",
          "x-default-empty": true
        }
      }
    },
    "AuthoredOutcome": {
      "type": [
        "object",
        "null"
      ],
      "description": "What success, failure or a named ending leaves behind.",
      "properties": {
        "days": {
          "type": "integer",
          "x-kind": "int",
          "description": "failure: the tale fails that many days after it was accepted.",
          "default": 0
        },
        "regard": {
          "type": "integer",
          "x-kind": "int",
          "description": "Added to the giver's regard for the player (negative takes it away).",
          "default": 0
        },
        "gold": {
          "type": "integer",
          "x-kind": "int",
          "description": "Paid to the player by the game (positive amounts only).",
          "default": 0
        },
        "memory": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "What the giver remembers, in the giver's own voice."
        },
        "journal": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "The last line written in the journal when the tale ends this way."
        },
        "consequences": {
          "type": [
            "array",
            "null"
          ],
          "items": {
            "$ref": "#/$defs/AuthoredConsequence"
          },
          "x-kind": "object:AuthoredConsequence[]",
          "description": "What else the ending leaves in the world. A consequence may hold only under a flag.",
          "x-default-empty": true
        }
      }
    },
    "GiverRequirement": {
      "type": [
        "object",
        "null"
      ],
      "description": "(no summary)",
      "properties": {
        "role": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "lord, notable, gang_leader, or any.",
          "enum": [
            "lord",
            "notable",
            "gang_leader",
            "any"
          ],
          "x-closed-list": "GiverRoles",
          "default": "lord"
        },
        "holds": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "\"{village}\": the village is picked among the giver's clan villages. Without it, the giver's home settlement is used, when it is a village."
        },
        "min_regard": {
          "type": "integer",
          "x-kind": "int",
          "description": "The giver's regard for the player on Calradia Remembers' own ledger (the one built in conversation, not the game's relation).",
          "default": 0
        },
        "not_at_war_with_player": {
          "type": "boolean",
          "x-kind": "bool",
          "description": "On by default: a giver whose realm is at war with the player never offers it.",
          "default": true
        }
      }
    },
    "PlaceRequirement": {
      "type": [
        "object",
        "null"
      ],
      "description": "(no summary)",
      "properties": {
        "type": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "village (the only kind bound so far).",
          "default": "village"
        },
        "near": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "\"forest\", or leave it empty for anywhere."
        }
      }
    },
    "RivalRequirement": {
      "type": [
        "object",
        "null"
      ],
      "description": "The {rival}: a clan leader of the giver's realm who is not the giver (branching tales, 04/10/2026).",
      "properties": {
        "role": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "clan_leader: the leader of another house of the giver's realm.",
          "enum": [
            "clan_leader"
          ],
          "x-closed-list": "RivalRoles",
          "default": "clan_leader"
        },
        "same_realm_as": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "\"{giver}\": the rival serves the same realm as the giver.",
          "default": "{giver}"
        }
      }
    },
    "PlayerRequirement": {
      "type": [
        "object",
        "null"
      ],
      "description": "(no summary)",
      "properties": {
        "min_clan_tier": {
          "type": "integer",
          "x-kind": "int",
          "description": "0 to 6.",
          "default": 0
        }
      }
    },
    "AuthoredObjective": {
      "type": [
        "object",
        "null"
      ],
      "description": "One condition the engine verifies; which fields matter depends on Type.",
      "properties": {
        "type": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "What the game checks.",
          "enum": [
            "talk_to",
            "talk_to_locals",
            "be_at",
            "keep_watch",
            "explore",
            "defeat_party",
            "return",
            "wait"
          ],
          "x-closed-list": "ObjectiveTypes"
        },
        "hero": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "talk_to: the character, as a role (\"{giver}\")."
        },
        "place": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "The place, as a role (\"{village}\")."
        },
        "count": {
          "type": "integer",
          "x-kind": "int",
          "description": "talk_to_locals: how many different notables of the place.",
          "default": 1
        },
        "radius": {
          "type": "number",
          "x-kind": "number",
          "description": "be_at, keep_watch: how near the place the party must be (default 5).",
          "default": 5.0
        },
        "nights": {
          "type": [
            "array",
            "null"
          ],
          "items": {
            "type": "integer"
          },
          "x-kind": "int[]",
          "description": "keep_watch: [first night it may happen, night it surely happens]."
        },
        "chance": {
          "type": "number",
          "x-kind": "number",
          "description": "keep_watch: the chance each night from the first opens the scene (0 to 1).",
          "default": 0.0
        },
        "days": {
          "type": "integer",
          "x-kind": "int",
          "description": "wait: how many days must pass with no other choice taken.",
          "default": 0
        },
        "scene": {
          "$ref": "#/$defs/AuthoredScene",
          "x-kind": "object:AuthoredScene",
          "description": "explore: the scene played in the chat."
        },
        "spawn": {
          "$ref": "#/$defs/AuthoredSpawn",
          "x-kind": "object:AuthoredSpawn",
          "description": "defeat_party: the band spawned near the place."
        },
        "item": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "Read but not played yet.",
          "x-played": false
        },
        "to": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "Read but not played yet.",
          "x-played": false
        }
      }
    },
    "AuthoredChoice": {
      "type": [
        "object",
        "null"
      ],
      "description": "One way out of a stage (branching tales, 04/10/2026).",
      "properties": {
        "id": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "The choice's name, unique in its stage."
        },
        "label": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "What the player can do, in plain words. In a scene, it is listed under the narration and the narrator is told it."
        },
        "journal": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "A line added to the journal under the stage's own, while this choice is open."
        },
        "next": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "Where this choice leads: a stage id, \"reward\", or \"end:<id>\"."
        },
        "if": {
          "$ref": "#/$defs/flags",
          "x-kind": "flags",
          "description": "Flags that must hold for this choice to be open (\"name\", or \"!name\" for not set). A closed choice is never shown nor taken.",
          "x-default-empty": true
        },
        "sets": {
          "$ref": "#/$defs/flags",
          "x-kind": "flags",
          "description": "Flags set when this choice is taken.",
          "x-default-empty": true
        },
        "default": {
          "type": "boolean",
          "x-kind": "bool",
          "description": "In a scene: taken when the scene closes with no choice made, if the stage has no on_complete.next.",
          "default": false
        },
        "objective": {
          "$ref": "#/$defs/AuthoredObjective",
          "x-kind": "object:AuthoredObjective",
          "description": "By an act: what the game checks (talk_to, return, talk_to_locals, be_at, defeat_party, wait). The first met wins."
        },
        "said": {
          "$ref": "#/$defs/AuthoredSaid",
          "x-kind": "object:AuthoredSaid",
          "description": "By words: taken when, in a conversation with that character, the player says or agrees to what it means."
        },
        "canvas": {
          "$ref": "#/$defs/lines",
          "x-kind": "lines",
          "description": "How the moment feels, for the character in whose conversation this choice is taken (as a stage's canvas).",
          "x-default-empty": true
        },
        "facts": {
          "type": [
            "array",
            "null"
          ],
          "items": {
            "$ref": "#/$defs/line"
          },
          "x-kind": "line[]",
          "description": "What that character must convey when this choice is taken.",
          "x-default-empty": true
        },
        "knowers": {
          "type": [
            "object",
            "null"
          ],
          "additionalProperties": {
            "type": [
              "array",
              "null"
            ],
            "items": {
              "$ref": "#/$defs/line"
            }
          },
          "x-kind": "map:line[]",
          "description": "Lines for that character, in the conversation that took this choice.",
          "x-default-empty": true
        }
      }
    },
    "AuthoredOnComplete": {
      "type": [
        "object",
        "null"
      ],
      "description": "(no summary)",
      "properties": {
        "next": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "The next stage's id, \"reward\" to end the tale in success, or \"end:<id>\" for a named ending."
        }
      }
    },
    "AuthoredConsequence": {
      "type": [
        "object",
        "null"
      ],
      "description": "(no summary)",
      "properties": {
        "type": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "memory or world_event.",
          "enum": [
            "memory",
            "world_event"
          ],
          "x-closed-list": "ConsequenceTypes"
        },
        "who": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "memory: who remembers, a role or \"locals_of:{place}\"."
        },
        "text": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "memory: what they remember."
        },
        "summary": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "world_event: the news that spreads through the realm."
        },
        "magnitude": {
          "type": "integer",
          "x-kind": "int",
          "description": "world_event: how loud the news is, 0 to 100.",
          "default": 0
        },
        "place": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "world_event: where it happened, as a role."
        },
        "if": {
          "$ref": "#/$defs/flags",
          "x-kind": "flags",
          "description": "Flags that must hold for this consequence to be carried out.",
          "x-default-empty": true
        }
      }
    },
    "AuthoredScene": {
      "type": [
        "object",
        "null"
      ],
      "description": "An exploration scene: the chat with a narrator and no character, until someone is met.",
      "properties": {
        "title": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "The name over the chat window during the scene (\"The burned barns of {village}\"). Empty: \"The wood by <village>\"."
        },
        "opening": {
          "$ref": "#/$defs/AuthoredBeat",
          "x-kind": "object:AuthoredBeat",
          "description": "What the narrator opens the scene with."
        },
        "findings": {
          "type": [
            "array",
            "null"
          ],
          "items": {
            "$ref": "#/$defs/AuthoredFinding"
          },
          "x-kind": "object:AuthoredFinding[]",
          "description": "What there is to discover. Without choices, at least one must be required.",
          "x-default-empty": true
        },
        "hazards": {
          "type": [
            "array",
            "null"
          ],
          "items": {
            "$ref": "#/$defs/AuthoredHazard"
          },
          "x-kind": "object:AuthoredHazard[]",
          "description": "What the player's choices can spring. Each springs once.",
          "x-default-empty": true
        },
        "encounters": {
          "type": [
            "array",
            "null"
          ],
          "items": {
            "$ref": "#/$defs/AuthoredEncounter"
          },
          "x-kind": "object:AuthoredEncounter[]",
          "description": "People who may be met in the scene, voiced by the narrator.",
          "x-default-empty": true
        },
        "closing": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "Shown when the scene closes, after any missed findings."
        }
      }
    },
    "AuthoredSpawn": {
      "type": [
        "object",
        "null"
      ],
      "description": "A party spawned for the quest: real, on the map, beaten in a real battle.",
      "properties": {
        "id": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "The band's name in the file."
        },
        "template": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "The bandit faction whose troops it is made of (looters by default).",
          "default": "looters"
        },
        "size": {
          "type": [
            "array",
            "null"
          ],
          "items": {
            "type": "integer"
          },
          "x-kind": "int[]",
          "description": "[fewest, most] men."
        },
        "name": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "Its name on the map."
        },
        "near": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",
          "description": "The place it patrols around, as a role."
        },
        "behavior": {
          "type": [
            "string",
            "null"
          ],
          "x-kind": "string",

<script id="quest-validator">
/* Calradia Remembers, the tale editor's checks: a JavaScript copy of AuthoredQuestLoader (C#, CalradiaRemembers.Logic).
   It reads a quest file the way the game does (Newtonsoft's lenient JSON, its conversions, its defaults) and reports
   the same problems in the same words, BLOCKING first, then COSMETIC. The fixtures in docs/design/quest-editor/fixtures
   run through both under the mod's test suite (C# directly, this file under Node), so the two cannot disagree
   silently. Change a message there, change it here. No DOM: the editor and Node run the very same code. */
(function (root) {
  'use strict';

  var SCHEMA = null;
  var LISTS = {};

  function init(schema) {
    SCHEMA = schema;
    LISTS = schema['x-lists'] || {};
  }

  // ------------------------------------------------------------------------------------------------------------------
  // 1. Reading the text: the JSON Newtonsoft's reader accepts (comments, trailing commas, single quotes, unquoted names,
  //    hexadecimal and octal numbers, NaN and Infinity, a lone comma read as "undefined").
  // ------------------------------------------------------------------------------------------------------------------

  function ReadError(message) { this.message = message; }

  var UNDEFINED = {undefinedToken: true};

  /** A number as Newtonsoft keeps it: an integer (exact, as a BigInt) or a float (a double). */
  function Num(kind, value) { this.kind = kind; this.value = value; }

  /** An object as JObject keeps it: a repeated name keeps its first place and its last value. */
  function Obj() { this.keys = []; this.map = new Map(); }
  Obj.prototype.set = function (k, v) { if (!this.map.has(k)) this.keys.push(k); this.map.set(k, v); };

  var WS = /[\t\n\u000B\f\r \u001C-\u001F\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]/;
  var IDENT = /[\p{L}\p{Nd}_$]/u;
  var NUMBER_CHAR = /[0-9a-fA-FxX.eE+\-]/;

  function parseJson(text) {
    var s = text == null ? '' : String(text), i = 0, n = s.length;

    function fail(what) { throw new ReadError(what + ' (at character ' + i + ')'); }
    function atEnd() { return i >= n || s[i] === '\u0000'; }
    function isDelimiter(c) { return c === undefined || c === '\u0000' || WS.test(c) || c === ',' || c === ']' || c === '}' || c === ')' || c === '/'; }

    function skipComment() {
      if (s[i + 1] === '*') {
        var end = s.indexOf('*/', i + 2);
        if (end < 0) fail('Unexpected end while parsing comment');
        i = end + 2;
      } else if (s[i + 1] === '/') {
        i += 2;
        while (i < n && s[i] !== '\r' && s[i] !== '\n') i++;
      } else fail('Unexpected end while parsing comment');
    }

    function skipSpace(comments) {
      for (;;) {
        if (i < n && WS.test(s[i])) i++;
        else if (comments && s[i] === '/') skipComment();
        else return;
      }
    }

    function word(w, value) {
      if (s.substr(i, w.length) !== w) fail('Unexpected character encountered while parsing value: ' + s[i]);
      i += w.length;
      if (!isDelimiter(s[i])) fail('Unexpected character after ' + w);
      return value;
    }

    function string(quote) {
      i++;
      var out = '';
      for (;;) {
        if (i >= n) fail('Unterminated string. Expected delimiter: ' + quote);
        var c = s[i++];
        if (c === quote) return out;
        if (c !== '\\') { out += c; continue; }
        if (i >= n) fail('Unterminated string. Expected delimiter: ' + quote);
        var e = s[i++];
        switch (e) {
          case '"': out += '"'; break;
          case "'": out += "'"; break;
          case '\\': out += '\\'; break;
          case '/': out += '/'; break;
          case 'b': out += '\b'; break;
          case 'f': out += '\f'; break;
          case 'n': out += '\n'; break;
          case 'r': out += '\r'; break;
          case 't': out += '\t'; break;
          case 'u':
            var hex = s.substr(i, 4);
            if (!/^[0-9a-fA-F]{4}$/.test(hex)) fail('Invalid Unicode escape sequence');
            out += String.fromCharCode(parseInt(hex, 16));
            i += 4;
            break;
          default: fail('Bad JSON escape sequence: \\' + e);
        }

      var t = s.substring(start, i), first = t[0];
      var nonBase10 = first === '0' && t.length > 1 && t[1] !== '.' && t[1] !== 'e' && t[1] !== 'E';
      if (nonBase10) {
        if (t[1] === 'x' || t[1] === 'X') {
          if (!/^0[xX][0-9a-fA-F]+$/.test(t)) fail("Input string '" + t + "' is not a valid number");
          return new Num('int', BigInt(t));
        }
        if (!/^0[0-7]+$/.test(t)) fail("Input string '" + t + "' is not a valid number");
        return new Num('int', BigInt('0o' + t.substring(1)));
      }
      if (/[.eE]/.test(t)) {
        if (!/^-?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(t)) fail("Input string '" + t + "' is not a valid number");
        return new Num('float', Number(t));

      if (!/^-?\d+$/.test(t)) fail("Input string '" + t + "' is not a valid number");
      return new Num('int', BigInt(t));

        case 't': return word('true', true);
        case 'f': return word('false', false);
        case 'N': return word('NaN', new Num('float', NaN));
        case 'I': return word('Infinity', new Num('float', Infinity));
        case '-':

        if (s[i] === ',') { i++; out.push(UNDEFINED); continue; }
        if (s[i] === '}') fail('JsonToken EndObject is not valid for closing JsonType Array');
        out.push(value());
        skipSpace(true);
        if (s[i] === ',') { i++; continue; }
        if (s[i] === ']') { i++; return out; }
        if (atEnd()) fail('Unexpected end');
        if (s[i] === '}') fail('JsonToken EndObject is not valid for closing JsonType Array');
        fail('After parsing a value an unexpected character was encountered: ' + s[i]);
      }
    }

    function object() {
      i++;
      var out = new Obj();
      for (;;) {
        skipSpace(true);
        if (atEnd()) fail('Unexpected end');

          k = mend + 2;
          if (mname === 'set') setFlags(margs);
          else if (mname === 'if') {
            var ic = condition(margs);
            if (ic === null) notes.push(where + ': <<if ' + margs.trim() + '>> is more than a flag; what it holds was kept with no condition.');
            stack.push({base: currentCond(), conds: ic === null ? [] : [ic], cond: ic === null ? currentCond() : currentCond().concat([ic])});
          } else if (mname === 'elseif') {
            notes.push(where + ': <<elseif ' + margs.trim() + '>> is not mapped; what it holds was kept with no condition of its own.');
            if (stack.length) { var f1 = stack[stack.length - 1]; f1.cond = f1.base.concat(f1.conds.map(negate)); }
          } else if (mname === 'else') {
            if (stack.length) { var f2 = stack[stack.length - 1]; f2.cond = f2.base.concat(f2.conds.map(negate)); }
          } else if (mname === '/if') stack.pop();
          else if (mname === 'link' || mname === 'button') {
            var lk = /^\[\[([\s\S]*)\]\]\s*$/.exec(margs.trim());
            if (lk) { var l2 = parseLink(lk[1]); l2.if = currentCond().slice(); out.links.push(l2); }
            else {
              var q = margs.match(/"[^"]*"|'[^']*'/g) || [];
              if (q.length >= 2) out.links.push({label: unquote(q[0]), target: unquote(q[1]), if: currentCond().slice()});
              else notes.push(where + ': <<' + mname + ' ' + margs.trim() + '>> leads nowhere the import can read; it was left out.');
            }
          } else if (mname === '/link' || mname === '/button') { /* the end of a link's body */ }
          else notes.push(where + ': <<' + body + '>> is not mapped; it was left out.');
          continue;
        }

        buffer += text[k++];
      }
      flush();
    }

    walk(p.text, []);
    return out;
  }

  // ------------------------------------------------------------------------------------------------------------------
  // 3. What a passage says: its lines by convention, and its tags.
  // ------------------------------------------------------------------------------------------------------------------

  var KNOWER = /^\s*(\{[a-z_]+\}|locals_of:\{[a-z_]+\})\s+knows\s*:\s*(.+)$/i;

  function clean(text) {
    return text.replace(/<[^>]+>/g, '').replace(/''|\/\/|\*\*|~~/g, '').replace(/[ \t]+/g, ' ');
  }

  function lines(passage) {
    var out = {canvas: [], facts: [], knowers: new Map(), journal: null, memory: null, closing: null, trigger: null};
    var paragraph = [];
    function endParagraph(cond) {
      var t = paragraph.join(' ').replace(/\s+/g, ' ').trim();
      if (t) out.canvas.push({text: t, if: cond});
      paragraph = [];
    }
    passage.pieces.forEach(function (piece) {
      var cond = piece.if;
      clean(piece.text).split('\n').forEach(function (raw, k, all) {
        var line = raw.trim(), m;
        if (!line) { endParagraph(cond); return; }
        if ((m = /^journal\s*:\s*(.+)$/i.exec(line))) { endParagraph(cond); out.journal = m[1].trim(); return; }
        if ((m = /^fact\s*:\s*(.+)$/i.exec(line))) { endParagraph(cond); out.facts.push({text: m[1].trim(), if: cond}); return; }
        if ((m = /^memory\s*:\s*(.+)$/i.exec(line))) { endParagraph(cond); out.memory = m[1].trim(); return; }
        if ((m = /^closing\s*:\s*(.+)$/i.exec(line))) { endParagraph(cond); out.closing = m[1].trim(); return; }
        if ((m = /^trigger\s*:\s*(.+)$/i.exec(line))) { endParagraph(cond); out.trigger = m[1].trim(); return; }
        if ((m = KNOWER.exec(line))) {
          endParagraph(cond);
          if (!out.knowers.has(m[1])) out.knowers.set(m[1], []);
          out.knowers.get(m[1]).push({text: m[2].trim(), if: cond});
          return;
        }
        paragraph.push(line);
        if (k === all.length - 1) endParagraph(cond);
      });
      endParagraph(cond);
    });
    return out;
  }

  var ACTS = ['talk_to', 'return', 'talk_to_locals', 'be_at', 'keep_watch', 'defeat_party', 'wait'];

  function role(name) { return '{' + (name || 'giver').toLowerCase() + '}'; }

  function range(s, fallback) {
    var m = /^(\d+)-(\d+)$/.exec(s || '');
    return m ? [parseInt(m[1], 10), parseInt(m[2], 10)] : fallback;
  }

  function readTags(p, slug, notes) {
    var where = "passage '" + p.name + "'", info = {act: null, explore: false, finding: false, required: false, hazard: null, hp: null,
      encounter: false, isDefault: false, regard: null, gold: null};
    p.tags.forEach(function (tag) {
      var parts = tag.split(':'), head = parts[0].toLowerCase(), m;
      if (ACTS.indexOf(head) >= 0) {
        if (info.act) { notes.push(where + ': it already says how the player gets there; tag "' + tag + '" was left out.'); return; }
        switch (head) {
          case 'talk_to': info.act = {type: 'talk_to', hero: role(parts[1])}; break;
          case 'return': info.act = {type: 'return'}; break;
          case 'talk_to_locals': info.act = {type: 'talk_to_locals', place: role(parts[1] || 'village'), count: parseInt(parts[2], 10) || 1}; break;
          case 'be_at':
            info.act = {type: 'be_at', place: role(parts[1] || 'village')};
            if (parts[2]) info.act.radius = parseFloat(parts[2]);
            break;
          case 'keep_watch':
            info.act = {type: 'keep_watch', place: role(parts[1] || 'village'), nights: range(parts[2], [2, 5]), chance: parts[3] ? parseFloat(parts[3]) : 0.35};
            if (!parts[2]) notes.push(where + ': keep_watch was given the nights 2 to 5 and a chance of 0.35 a night; change them in the editor.');
            break;
          case 'defeat_party':
            info.act = {type: 'defeat_party', spawn: {id: slug, name: p.name, near: role(parts[1] || 'village'), size: range(parts[2], [10, 16])}};
            if (!parts[2]) notes.push(where + ': the band was given 10 to 16 men; change it in the editor.');
            break;
          case 'wait':
            info.act = {type: 'wait', days: parseInt(parts[1], 10) || 1};
            break;
        }
        return;
      }
      if (head === 'explore' || head === 'scene') info.explore = true;
      else if (head === 'finding') info.finding = true;
      else if (head === 'required') info.required = true;
      else if (head === 'hazard') info.hazard = info.hazard || 'injure';
      else if (head === 'injure' || head === 'alert' || head === 'lose_time') info.hazard = head;
      else if (head === 'hp') info.hp = range(parts[1], null);
      else if (head === 'encounter') info.encounter = true;
      else if (head === 'default') info.isDefault = true;
      else if (head === 'ending') { /* every passage with no links is an ending already */ }
      else if ((head === 'regard' || head === 'gold') && (m = /^[+-]?\d+$/.exec(parts[1] || ''))) info[head] = parseInt(m[0], 10);
      else notes.push(where + ': tag "' + tag + '" is not understood; it was left out.');
    });
    return info;
  }

  // ------------------------------------------------------------------------------------------------------------------
  // 4. The tale.
  // ------------------------------------------------------------------------------------------------------------------

  function slugify(name) {
    var s = name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
    return s || 'passage';
  }

  function importText(text, fileName) {
    var notes = [];
    var story = /<tw-storydata\b/i.test(text) ? readHtml(text, notes) : readTwee(text, notes);
    if (!story.start) throw new Error('The story has no passages.');
    if (story.format && !/harlowe|sugarcube/i.test(story.format))
      notes.push('The story is written for ' + story.format + "; only Harlowe's and SugarCube's links, (set:) and (if:) are read.");

    var byName = new Map(), slugs = new Set();
    story.passages.forEach(function (p) {
      if (byName.has(p.name)) { notes.push("Two passages are called '" + p.name + "'; only the first is imported."); return; }
      var s = slugify(p.name), base = s, n = 2;
      while (slugs.has(s)) s = base + '_' + n++;
      slugs.add(s);
      var read = readPassage(p, notes);
      read.slug = s;
      read.info = readTags(p, s, notes);
      read.lines = lines(read);
      byName.set(p.name, read);
    });

    var start = byName.get(story.start.name);
    var reached = new Set([start.name]), queue = [start];
    while (queue.length) {
      var at = queue.shift();
      at.links = at.links.filter(function (l) {
        if (byName.has(l.target)) return true;
        notes.push("passage '" + at.name + "': its link \"" + l.label + "\" leads to '" + l.target + "', which is no passage; it was left out.");
        return false;
      });
      at.links.forEach(function (l) { if (!reached.has(l.target)) { reached.add(l.target); queue.push(byName.get(l.target)); } });
    }
    byName.forEach(function (p) { if (!reached.has(p.name)) notes.push("passage '" + p.name + "' is never linked from the start; it was not imported."); });

    var stages = [], made = new Map(), endings = {}, choiceIds = new Map();

    function isBeat(p) { return p.info.finding || p.info.hazard !== null || p.info.encounter; }
    function target(l) { return byName.get(l.target); }
    function plain(ls) { return ls.map(function (l) { return l.if.length ? {text: l.text, if: l.if.length === 1 ? l.if[0] : l.if.slice()} : l.text; }); }
    function knowersOf(p) {
      var k = {};
      p.lines.knowers.forEach(function (v, key) { k[key] = plain(v); });
      return k;
    }
    function ways(p) { return p.links.filter(function (l) { return !(p.info.explore && isBeat(target(l))); }); }
    function flagsOf(c) { return c.length === 0 ? undefined : c.length === 1 ? c[0] : c.slice(); }
    function sentence(label) { return /[.!?:]$/.test(label) ? label : label + '.'; }

    /** The journal line of the way toward a passage: its own "Journal:" line (for an ending, that line closes the tale instead). */
    function journalToward(t, label) { return t.lines.journal && ways(t).length > 0 ? t.lines.journal : sentence(label); }

    function say(o, p) {
      if (p.lines.canvas.length && !p.info.explore) o.canvas = plain(p.lines.canvas).length === 1 ? plain(p.lines.canvas)[0] : plain(p.lines.canvas);
      if (p.lines.facts.length && !p.info.explore) o.facts = plain(p.lines.facts);
      if (p.lines.knowers.size) o.knowers = knowersOf(p);
      return o;
    }

    function ending(p) {
      if (!(p.slug in endings)) {
        var e = {};
        if (p.info.regard !== null) e.regard = p.info.regard;
        if (p.info.gold !== null) e.gold = p.info.gold;
        if (p.lines.memory) e.memory = p.lines.memory;
        if (p.lines.journal) e.journal = p.lines.journal;
        endings[p.slug] = e;
      }
      return 'end:' + p.slug;
    }

    /** Where the story goes once this passage has happened. */
    function after(p) {
      var w = ways(p);
      if (p.info.explore) return scene(p);
      if (w.length === 0) return ending(p);
      if (w.length === 1 && w[0].if.length === 0) {
        var t = target(w[0]);
        if (!t.info.act && t.info.explore) return after(t);
      }
      return decision(p, p === start ? p.slug + '_after' : p.slug);
    }

    function uniqueChoiceId(stageId, id) {
      if (!choiceIds.has(stageId)) choiceIds.set(stageId, new Set());
      var used = choiceIds.get(stageId), s = id, n = 2;
      while (used.has(s)) s = id + '_' + n++;
      used.add(s);
      return s;
    }

    function noAct(p, from) {
      notes.push("passage '" + p.name + "' has no tag saying what the player does to get there (talk_to:giver, be_at:village, wait:3...), so the way from '"
        + from.name + "' cannot be taken yet; give it one in the editor.");
    }

    function decision(p, id) {
      if (made.has(id)) return id;
      var stage = {id: id};
      made.set(id, stage);
      stages.push(stage);
      var w = ways(p);
      var t0 = target(w[0]);
      if (w.length === 1 && w[0].if.length === 0 && t0.sets.length === 0) {
        stage.journal = journalToward(t0, w[0].label);
        if (t0.info.act) stage.objective = t0.info.act; else noAct(t0, p);
        say(stage, t0);
        stage.on_complete = {next: after(t0)};
        return id;
      }
      stage.choices = w.map(function (l) {
        var t = target(l), c = {id: uniqueChoiceId(id, t.slug), label: l.label, journal: journalToward(t, l.label)};
        if (flagsOf(l.if)) c.if = flagsOf(l.if);
        if (t.sets.length) c.sets = t.sets.length === 1 ? t.sets[0] : t.sets.slice();
        if (t.info.act) {
          c.objective = t.info.act;
          if (t.info.act.type === 'keep_watch')
            notes.push("passage '" + t.name + "': a way out among several cannot keep watch (the game counts nights only for a stage's own watch); make it the only link of '" + p.name + "', or lead it to a passage that does.");
        } else noAct(t, p);
        say(c, t);
        c.next = after(t);
        return c;
      });
      return id;
    }

    function scene(p) {
      if (made.has(p.slug)) return p.slug;
      var stage = {id: p.slug};
      made.set(p.slug, stage);
      stages.push(stage);
      if (p.lines.journal) stage.journal = p.lines.journal;
      else stage.journal = sentence(p.name);
      if (p.lines.canvas.some(function (l) { return l.if.length; }))
        notes.push("passage '" + p.name + "': a scene's opening cannot depend on flags; its lines were kept with no condition.");
      var sc = {title: p.name, opening: {canvas: p.lines.canvas.map(function (l) { return l.text; }).join(' ')}};
      if (p.lines.facts.length) sc.opening.facts = p.lines.facts.map(function (l) { return l.text; });
      var findings = [], hazards = [], encounters = [];
      p.links.forEach(function (l) {
        var t = target(l);
        if (!isBeat(t)) return;
        var body = t.lines.canvas.map(function (x) { return x.text; }).join(' ');
        if (t.info.finding) {
          var f = {id: t.slug, required: t.info.required, text: body};
          if (t.sets.length) f.sets = t.sets.length === 1 ? t.sets[0] : t.sets.slice();
          findings.push(f);
        } else if (t.info.hazard) {
          var h = {id: t.slug, trigger: t.lines.trigger || l.label.charAt(0).toLowerCase() + l.label.substring(1), effect: {type: t.info.hazard}};
          if (t.info.hazard === 'injure') h.effect.hit_points = t.info.hp || [10, 25];
          if (t.info.hazard === 'injure' && !t.info.hp) notes.push("passage '" + t.name + "': the hazard was given 10 to 25 hit points; change it in the editor (tag hp:10-25).");
          hazards.push(h);
        } else {
          var en = {id: t.slug, name: t.name, persona: body};
          if (t.lines.facts.length) en.knows = t.lines.facts.map(function (x) { return x.text; });
          if (t.sets.length) en.sets = t.sets.length === 1 ? t.sets[0] : t.sets.slice();
          encounters.push(en);
        }
      });
      if (findings.length) sc.findings = findings;
      if (hazards.length) sc.hazards = hazards;
      if (encounters.length) sc.encounters = encounters;
      if (p.lines.closing) sc.closing = p.lines.closing;
      stage.objective = {type: 'explore', scene: sc};
      say(stage, p);

      var w = ways(p);
      if (w.length === 0) {
        stage.on_complete = {next: ending(p)};
        return p.slug;
      }
      var chosenDefault = w.filter(function (l) { return target(l).info.isDefault; })[0];
      if (!chosenDefault) {
        chosenDefault = w.filter(function (l) { return l.if.length === 0; })[0];
        if (chosenDefault) notes.push("passage '" + p.name + "': no way out is tagged \"default\", so \"" + chosenDefault.label + '" is taken when the scene closes with none chosen.');
      }
      stage.choices = w.map(function (l) {
        var t = target(l), c = {id: uniqueChoiceId(p.slug, t.slug), label: l.label};
        if (flagsOf(l.if)) c.if = flagsOf(l.if);
        if (t.sets.length) c.sets = t.sets.length === 1 ? t.sets[0] : t.sets.slice();
        if (l === chosenDefault) c.default = true;
        c.next = arrival(t, l);
        return c;
      });
      return p.slug;
    }

    /** A way out of a scene leads here: straight on, or through a stage that waits for the passage's act. */
    function arrival(t, l) {
      if (!t.info.act) {
        if (ways(t).length === 0 && !t.info.explore && t.lines.canvas.length && !t.lines.journal)
          notes.push("passage '" + t.name + "': an ending reached straight from a scene has no conversation to say its text in; write what the journal should say on a \"Journal:\" line.");
        return after(t);
      }
      var id = t.slug + '_way';
      if (made.has(id)) return id;
      var stage = {id: id, journal: journalToward(t, l.label)};
      made.set(id, stage);
      stages.push(stage);
      stage.objective = t.info.act;
      say(stage, t);
      stage.on_complete = {next: after(t)};
      return id;
    }

    // The request: the start passage, said by the giver when the tale is offered.
    var request = {id: start.slug, journal: start.lines.journal || '{giver} has asked for your help.', objective: {type: 'talk_to', hero: '{giver}'}};
    if (start.info.act || start.info.explore) notes.push("passage '" + start.name + "' is the start, made in the conversation where the tale is offered; its tags were left out.");
    if (start.sets.length) notes.push("passage '" + start.name + "': flags cannot be set by the request itself; set them on the passage that follows.");
    stages.push(request);
    made.set(start.slug, request);
    say(request, start);
    start.info.explore = false;
    request.on_complete = {next: ways(start).length === 0 ? 'reward' : after(start)};
    if (ways(start).length === 0) notes.push("passage '" + start.name + "' links nowhere; the tale ends with its reward as soon as it is taken on.");

    // Roles the text uses, bound by the game: the giver always, the village and the rival when the story names them.
    var all = JSON.stringify(stages) + JSON.stringify(endings), used = [], m, re = /\{([a-z_]+)\}/g;
    while ((m = re.exec(all)) !== null) if (used.indexOf(m[1]) < 0) used.push(m[1]);
    var binds = {giver: 'the one who asks for help'};
    var requires = {giver: {role: 'lord'}};
    if (used.indexOf('village') >= 0) { binds.village = 'the village the tale happens in'; requires.giver.holds = '{village}'; requires.village = {type: 'village'}; }
    if (used.indexOf('rival') >= 0) { binds.rival = 'the head of another house of the giver\'s realm'; requires.rival = {role: 'clan_leader'}; }
    used.forEach(function (r) {
      if (!(r in binds)) {
        binds[r] = 'a role the game does not bind yet';
        notes.push('{' + r + '} is used, but the game binds only {giver}, {village} and {rival}; the player would read it as written.');
      }
    });

    var quest = {
      id: 'custom_' + slugify(story.title),
      title: story.title,
      author: 'imported from Twine' + (fileName ? ' (' + fileName + ')' : ''),
      requires: requires,
      binds: binds,
      stages: stages
    };
    if (Object.keys(endings).length) quest.endings = endings;
    notes.push('No time limit was set: the tale never fails on its own. Add one under Failure if it should.');
    return {quest: quest, notes: notes};
  }

  root.TwineImport = {importText: importText};
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
<script id="tale-editor-app">
/*APP*/
</script>
