<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tale Editor</title>
<style id="tale-editor-style">
:root {
  --bg: #141210;
  --bg-2: #1b1815;
  --surface: #221e1a;
  --surface-2: #2a2520;
  --surface-3: #332d27;
  --line: #3a332c;
  --line-strong: #4d443b;
  --text: #ece4d6;
  --text-2: #b9ad99;
  --text-3: #8a7f6f;
  --accent: #d9a65a;
  --accent-strong: #f0c27f;
  --accent-ink: #1b1409;
  --accent-soft: rgba(217, 166, 90, 0.14);
  --danger: #e07563;
  --danger-soft: rgba(224, 117, 99, 0.14);
  --warn: #dcb256;
  --warn-soft: rgba(220, 178, 86, 0.14);
  --ok: #8dbb7f;
  --ok-soft: rgba(141, 187, 127, 0.14);
  --info: #8fb2d6;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  --radius: 10px;
  --radius-sm: 6px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-tale: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, "Times New Roman", serif;
  --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, "Liberation Mono", monospace;
  color-scheme: dark;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #efe8dc;
    --bg-2: #e8e0d2;
    --surface: #fbf7f0;
    --surface-2: #f4eee4;
    --surface-3: #ebe3d6;
    --line: #dccfbd;
    --line-strong: #c8b8a2;
    --text: #2a2119;
    --text-2: #5c4f41;
    --text-3: #8a7b69;
    --accent: #9c6a1f;
    --accent-strong: #7d5214;
    --accent-ink: #fff8ec;
    --accent-soft: rgba(156, 106, 31, 0.12);
    --danger: #b4432f;
    --danger-soft: rgba(180, 67, 47, 0.1);
    --warn: #9a6f08;
    --warn-soft: rgba(154, 111, 8, 0.12);
    --ok: #3f7a35;
    --ok-soft: rgba(63, 122, 53, 0.1);
    --info: #2f5f8f;
    --shadow: 0 10px 30px rgba(60, 40, 20, 0.14);
    color-scheme: light;
  }
}

:root[data-theme="light"] {
  --bg: #efe8dc;
  --bg-2: #e8e0d2;
  --surface: #fbf7f0;
  --surface-2: #f4eee4;
  --surface-3: #ebe3d6;
  --line: #dccfbd;
  --line-strong: #c8b8a2;
  --text: #2a2119;
  --text-2: #5c4f41;
  --text-3: #8a7b69;
  --accent: #9c6a1f;
  --accent-strong: #7d5214;
  --accent-ink: #fff8ec;
  --accent-soft: rgba(156, 106, 31, 0.12);
  --danger: #b4432f;
  --danger-soft: rgba(180, 67, 47, 0.1);
  --warn: #9a6f08;
  --warn-soft: rgba(154, 111, 8, 0.12);
  --ok: #3f7a35;
  --ok-soft: rgba(63, 122, 53, 0.1);
  --info: #2f5f8f;
  --shadow: 0 10px 30px rgba(60, 40, 20, 0.14);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
::selection { background: var(--accent-soft); }

/* ---------- the frame ---------- */
.app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: var(--bg-2); border-bottom: 1px solid var(--line);
  min-height: 58px;
}
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: 8px; white-space: nowrap; }
.brand-mark {
  width: 30px; height: 30px; align-self: center; border-radius: 8px; display: grid; place-items: center;
  background: linear-gradient(145deg, var(--accent-strong), var(--accent)); color: var(--accent-ink); font: 700 16px var(--font-tale);
}
.brand-name { font: 600 18px var(--font-tale); letter-spacing: 0.2px; }
.brand-sub { color: var(--text-3); font-size: 12px; }
.doc-name { color: var(--text-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 280px; }
.doc-name .dirty { color: var(--accent); margin-left: 4px; }
.spacer { flex: 1; }
.toolbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px;
  border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface);
  cursor: pointer; white-space: nowrap; transition: background 0.12s, border-color 0.12s;
}
.btn:hover { background: var(--surface-2); border-color: var(--text-3); }
.btn:focus-visible, .icon-btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .outline-item:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.small { height: 26px; padding: 0 8px; font-size: 12px; }
.btn.danger { color: var(--danger); }
.btn svg, .icon-btn svg { width: 16px; height: 16px; flex: none; }
.icon-btn {
  width: 28px; height: 28px; display: inline-grid; place-items: center; border-radius: var(--radius-sm);
  border: 1px solid transparent; background: transparent; cursor: pointer; color: var(--text-2);
}
.icon-btn:hover { background: var(--surface-3); color: var(--text); }
.icon-btn:disabled { opacity: 0.35; cursor: default; background: transparent; }
.icon-btn.danger:hover { color: var(--danger); }

.menu { position: relative; }
.menu-list {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; min-width: 240px; padding: 6px;
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); box-shadow: var(--shadow);
}
.menu-list[hidden] { display: none; }
.menu-item { display: block; width: 100%; text-align: left; padding: 8px 10px; border: 0; background: transparent; border-radius: var(--radius-sm); cursor: pointer; }
.menu-item:hover { background: var(--surface-2); }
.menu-item small { display: block; color: var(--text-3); }

.workspace { display: grid; grid-template-columns: 290px minmax(0, 1fr) 360px; min-height: 0; }
.panel { min-height: 0; overflow: auto; }
.sidebar { background: var(--bg-2); border-right: 1px solid var(--line); padding: 14px 10px 24px; }
.checks { background: var(--bg-2); border-left: 1px solid var(--line); padding: 14px 14px 24px; }
.main { display: grid; grid-template-rows: auto 1fr; min-height: 0; overflow: hidden; }

/* ---------- the outline ---------- */
.side-title { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; font-weight: 600; }
.tale-picker { display: flex; gap: 6px; padding: 0 6px 10px; }
.tale-picker select { flex: 1; min-width: 0; }
.outline { list-style: none; margin: 0 0 12px; padding: 0; }
.outline-item {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 8px; border-radius: var(--radius-sm);
  border: 1px solid transparent; background: transparent; cursor: pointer; text-align: left; color: var(--text);
}
.outline-item:hover { background: var(--surface); }
.outline-item.active { background: var(--accent-soft); border-color: rgba(217, 166, 90, 0.35); }
.outline-item .kind { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--surface-3); color: var(--text-2); font-size: 11px; font-weight: 700; flex: none; }
.outline-item.active .kind { background: var(--accent); color: var(--accent-ink); }
.outline-item .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.outline-item .sub { color: var(--text-3); font-size: 12px; }
.outline-item .first { color: var(--accent); font-size: 11px; }
.badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; font-size: 11px; font-weight: 700; display: inline-grid; place-items: center; }
.badge.blocking { background: var(--danger); color: #fff; }
.badge.cosmetic { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); }
.outline-row { display: flex; align-items: center; gap: 2px; }
.outline-row .outline-item { flex: 1; min-width: 0; }
.outline-row .row-tools { display: none; }
.outline-row:hover .row-tools, .outline-row:focus-within .row-tools { display: flex; }
.add-row { margin: 2px 6px 0; }

/* ---------- tabs ---------- */
.tabs { display: flex; align-items: center; gap: 2px; padding: 8px 16px 0; border-bottom: 1px solid var(--line); background: var(--bg); }
.tab { border: 0; background: transparent; padding: 9px 14px; border-radius: var(--radius-sm) var(--radius-sm) 0 0; cursor: pointer; color: var(--text-2); border-bottom: 2px solid transparent; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.tab-body { min-height: 0; overflow: auto; }
.tab-tools { margin-left: auto; display: flex; gap: 6px; padding-bottom: 6px; }

/* ---------- the forms ---------- */
.editor { max-width: 980px; margin: 0 auto; padding: 22px 28px 80px; }
.editor-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
.editor-head h1 { margin: 0; font: 600 24px/1.25 var(--font-tale); }
.editor-head .crumb { color: var(--text-3); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
.editor-head .intro { color: var(--text-2); margin: 6px 0 0; max-width: 70ch; }
.section { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin: 0 0 16px; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.section-head h2 { margin: 0; font-size: 14px; font-weight: 650; letter-spacing: 0.01em; }
.section-head p { margin: 0; color: var(--text-3); font-size: 12.5px; }
.section-body { padding: 14px 16px 6px; }
.section.collapsed .section-body { display: none; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0 18px; }
.field { margin: 0 0 14px; position: relative; }
.field.wide { grid-column: 1 / -1; }
.field > label, .field > .label { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 12.5px; color: var(--text); margin-bottom: 5px; }
.field .help { color: var(--text-3); font-size: 12px; margin: 4px 0 0; }
.field .help code { font-family: var(--mono); font-size: 11.5px; background: var(--surface-3); padding: 1px 4px; border-radius: 4px; color: var(--text-2); }
.not-played { font-size: 10.5px; font-weight: 600; color: var(--info); border: 1px solid var(--info); border-radius: 9px; padding: 0 6px; text-transform: uppercase; letter-spacing: 0.05em; }
input[type="text"], input[type="number"], select, textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 7px 9px; color: var(--text);
}
textarea { min-height: 64px; resize: vertical; font-family: var(--font-tale); font-size: 14.5px; line-height: 1.5; }
textarea.short { min-height: 40px; }
input.mono, .mono { font-family: var(--mono); font-size: 12.5px; }
input[type="number"] { max-width: 160px; }
.pair { display: flex; gap: 8px; align-items: center; }
.pair input { max-width: 110px; }
.pair span { color: var(--text-3); }
.check { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.field.has-blocking input, .field.has-blocking select, .field.has-blocking textarea, .field.has-blocking .seg { border-color: var(--danger); }
.field.has-cosmetic input, .field.has-cosmetic select, .field.has-cosmetic textarea { border-color: var(--warn); }
.field-problems { margin-top: 6px; display: grid; gap: 4px; }
.field-problem { font-size: 12px; border-radius: var(--radius-sm); padding: 5px 8px; }
.field-problem.blocking { background: var(--danger-soft); color: var(--danger); }
.field-problem.cosmetic { background: var(--warn-soft); color: var(--warn); }
.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }

.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); overflow: hidden; }
.seg button { border: 0; background: var(--bg); padding: 6px 12px; cursor: pointer; color: var(--text-2); border-right: 1px solid var(--line-strong); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

.list { display: grid; gap: 10px; margin-bottom: 12px; }
.card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); }
.card-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 12px; border-bottom: 1px solid var(--line); }
.card-head .title { font-weight: 650; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-head .title small { color: var(--text-3); font-weight: 500; margin-left: 6px; }
.card-body { padding: 12px 12px 2px; }
.card.collapsed .card-body { display: none; }
.card .kind-chip { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--surface-3); color: var(--text-2); white-space: nowrap; }
.card .kind-chip.act { color: var(--accent); }
.card .kind-chip.scene { color: var(--info); }
.card .kind-chip.words { color: var(--ok); }

.line-row { display: grid; grid-template-columns: 1fr 190px auto; gap: 8px; align-items: start; margin-bottom: 8px; }
.line-row .if-box input { font-family: var(--mono); font-size: 12px; }
.line-row .if-box label { display: block; font-size: 11px; color: var(--text-3); margin-bottom: 2px; }
.row-tools { display: flex; gap: 2px; }
.kv-row { display: grid; grid-template-columns: 200px 1fr auto; gap: 8px; margin-bottom: 8px; align-items: start; }
.subhead { font-size: 12px; font-weight: 650; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.06em; margin: 6px 0 8px; }
.empty-note { color: var(--text-3); font-style: italic; margin: 0 0 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--mono); font-size: 11.5px; padding: 1px 7px; border-radius: 9px; border: 1px solid var(--line-strong); color: var(--text-2); }

/* ---------- the checks ---------- */
.verdict { border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; border: 1px solid; }
.verdict.ok { background: var(--ok-soft); border-color: var(--ok); }
.verdict.bad { background: var(--danger-soft); border-color: var(--danger); }
.verdict.warn { background: var(--warn-soft); border-color: var(--warn); }
.verdict strong { display: block; font-size: 14px; }
.verdict span { color: var(--text-2); font-size: 12.5px; }
.problem-group h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-3); margin: 14px 0 8px; display: flex; gap: 8px; align-items: center; }
.problem {
  display: block; width: 100%; text-align: left; border: 1px solid var(--line); border-left-width: 3px; border-radius: var(--radius-sm);
  background: var(--surface); padding: 8px 10px; margin-bottom: 8px; cursor: pointer; color: var(--text); font-size: 12.5px;
}
.problem:hover { background: var(--surface-2); }
.problem.blocking { border-left-color: var(--danger); }
.problem.cosmetic { border-left-color: var(--warn); }
.problem .where { display: block; color: var(--text-3); font-size: 11.5px; margin-bottom: 2px; font-family: var(--mono); }
.notes { border: 1px solid var(--info); border-radius: var(--radius); padding: 10px 12px; margin: 14px 0; background: var(--surface); }
.notes h3 { margin: 0 0 6px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.notes h3 > svg { width: 16px; height: 16px; color: var(--info); flex: none; }
.notes ul { margin: 0; padding-left: 18px; color: var(--text-2); font-size: 12.5px; }
.notes li { margin: 4px 0; }

/* ---------- the story map ---------- */
.map-wrap { position: relative; height: 100%; min-height: 420px; overflow: hidden; background:
  radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0) 0 0 / 22px 22px, var(--bg); cursor: grab; }
.map-wrap.panning { cursor: grabbing; }
.map-wrap > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.map-tools { position: absolute; right: 14px; top: 14px; display: flex; gap: 6px; z-index: 2; }
.legend { position: absolute; left: 14px; bottom: 14px; z-index: 2; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 12px; font-size: 11.5px; opacity: 0.92; color: var(--text-2); display: grid; gap: 4px; box-shadow: var(--shadow); }
.legend i { display: inline-block; width: 26px; height: 0; border-top: 2px solid var(--text-2); vertical-align: middle; margin-right: 6px; }
.legend i.scene { border-top-style: dashed; border-color: var(--info); }
.legend i.words { border-top-style: dotted; border-color: var(--ok); }
.legend i.act { border-color: var(--accent); }
.legend i.broken { border-color: var(--danger); border-top-style: dashed; }
.node { cursor: pointer; }
.node rect { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.5; }
.node.first rect { stroke: var(--accent); stroke-width: 2; }
.node.ending rect { fill: var(--surface-2); }
.node.ending.reward rect, .node.ending.named rect { stroke: var(--ok); }
.node.dead rect { stroke: var(--danger); stroke-width: 2.5; }
.node.missing rect { fill: var(--danger-soft); stroke: var(--danger); stroke-dasharray: 5 4; }
.node.unreached { opacity: 0.42; }
.node.selected rect { stroke: var(--accent-strong); stroke-width: 3; }
.node:hover rect { fill: var(--surface-2); }
.node text { fill: var(--text); font: 600 13px var(--font); }
.node text.sub { fill: var(--text-3); font: 11.5px var(--font); }
.node text.tag { fill: var(--accent); font: 700 10px var(--font); letter-spacing: 0.06em; }
.group-frame rect { fill: var(--surface-2); stroke: var(--ok); stroke-width: 1.5; stroke-dasharray: 3 4; }
.group-frame text { fill: var(--ok); font: 700 10px var(--font); letter-spacing: 0.06em; }
.group-frame text.sub { fill: var(--text-3); font: 11px var(--font); letter-spacing: 0; }
.edge { fill: none; stroke: var(--text-3); stroke-width: 1.6; }
.edge.act { stroke: var(--accent); }
.edge.scene { stroke: var(--info); stroke-dasharray: 7 5; }
.edge.words { stroke: var(--ok); stroke-dasharray: 2 4; }
.edge.broken { stroke: var(--danger); stroke-dasharray: 6 4; }
.edge.unreached { opacity: 0.35; }
.edge-label rect { fill: var(--bg-2); stroke: var(--line); }
.edge-label text { fill: var(--text-2); font: 11.5px var(--font); }
.edge-label.gated text { fill: var(--warn); }
.edge.near { stroke-width: 3; opacity: 1; }

/* The summary under the story map (Gabriel, 25/10/2026): see a stage without leaving the map, sized like VS Code's terminal. */
.summary-sub { margin: 10px 0 4px; color: var(--text-3); font: 700 10.5px var(--font); letter-spacing: 0.06em; text-transform: uppercase; }
.map-split { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.map-split > .map-wrap { flex: 1 1 auto; height: auto; min-height: 160px; }
.map-summary { flex: 0 0 auto; display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-top: 1px solid var(--line-strong); }
.map-summary[hidden] { display: none; }
.summary-grip { flex: 0 0 6px; cursor: ns-resize; background: transparent; border: 0; padding: 0; }
.summary-grip:hover, .summary-grip.dragging { background: var(--accent); }
.summary-head { display: flex; align-items: center; gap: 10px; padding: 6px 14px 8px; border-bottom: 1px solid var(--line); }
.summary-head .tag { color: var(--accent); font: 700 10px var(--font); letter-spacing: 0.06em; }
.summary-head strong { font-size: 14px; }
.summary-head .sub { color: var(--text-3); font-size: 12.5px; }
.summary-head .tools { margin-left: auto; display: flex; gap: 6px; }
.summary-body { overflow: auto; padding: 10px 14px 16px; display: grid; gap: 10px; align-content: start; }
.summary-rows { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; font-size: 13px; }
.summary-rows dt { color: var(--text-3); }
.summary-rows dd { margin: 0; color: var(--text); white-space: pre-wrap; }
.summary-body h4 { margin: 4px 0 2px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); }
.summary-list { margin: 0; padding-left: 18px; font-size: 13px; display: grid; gap: 3px; }
.summary-list .mono, .summary-rows .mono { font-family: var(--mono); font-size: 12px; }
.summary-list .when { color: var(--warn); }
.summary-thumbs { display: flex; flex-wrap: wrap; gap: 6px; }
.summary-thumbs img { height: 64px; border-radius: var(--radius-sm); border: 1px solid var(--line); }

/* ---------- the JSON view, the welcome, the toasts ---------- */
.json-view { margin: 0; padding: 18px 24px 60px; font: 12.5px/1.55 var(--mono); color: var(--text-2); white-space: pre; tab-size: 2; }
.raw-edit { padding: 18px 24px; display: grid; gap: 10px; height: 100%; grid-template-rows: auto 1fr auto; }
.raw-edit textarea { font: 12.5px/1.55 var(--mono); height: 100%; min-height: 300px; }
.welcome { max-width: 760px; margin: 0 auto; padding: 48px 28px; }
.welcome h1 { font: 600 32px/1.2 var(--font-tale); margin: 0 0 8px; }
.welcome p.lead { color: var(--text-2); font-size: 15px; margin: 0 0 28px; max-width: 62ch; }
.starts { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.start {
  text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 16px; cursor: pointer;
  display: grid; gap: 6px; transition: border-color 0.12s, transform 0.12s;
}
.start:hover { border-color: var(--accent); transform: translateY(-1px); }
.start strong { font-size: 15px; }
.start span { color: var(--text-2); font-size: 13px; }
.start .glyph { font: 22px var(--font-tale); color: var(--accent); }
.drop-hint { margin-top: 26px; color: var(--text-3); font-size: 13px; }
.drop-overlay { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; background: rgba(10, 8, 6, 0.7); }
.drop-overlay.on { display: grid; }
.drop-overlay div { border: 2px dashed var(--accent); border-radius: 18px; padding: 40px 60px; color: var(--text); font: 600 20px var(--font-tale); background: var(--surface); }
.toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 60; display: grid; gap: 8px; }
.toast { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 10px 14px; box-shadow: var(--shadow); max-width: 560px; }
.toast.error { border-color: var(--danger); }
.kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--text-2); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (max-width: 1280px) {
  .workspace { grid-template-columns: 250px minmax(0, 1fr) 300px; }
}
@media (max-width: 1050px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100vh; }
  .workspace { grid-template-columns: 1fr; }
  .sidebar, .checks { border: 0; border-bottom: 1px solid var(--line); max-height: none; }
  .main { min-height: 70vh; }
  .editor { padding: 18px 16px 60px; }
  .line-row, .kv-row { grid-template-columns: 1fr; }
}
</style>
</head>

<div class="app">

<script id="quest-validator">
/* Calradia Remembers, the tale editor's checks: a JavaScript copy of AuthoredQuestLoader (C#, CalradiaRemembers.Logic).
   It reads a quest file the way the game does (Newtonsoft's lenient JSON, its conversions, its defaults) and reports
   the same problems in the same words, BLOCKING first, then COSMETIC. The fixtures in docs/design/quest-editor/fixtures
   run through both under the mod's test suite (C# directly, this file under Node), so the two cannot disagree
   silently. Change a message there, change it here. No DOM: the editor and Node run the very same code. */
(function (root) {
  'use strict';

  var SCHEMA = null;
  var LISTS = {};

  function init(schema) {
    SCHEMA = schema;
    LISTS = schema['x-lists'] || {};
  }

  // ------------------------------------------------------------------------------------------------------------------
  // 1. Reading the text: the JSON Newtonsoft's reader accepts (comments, trailing commas, single quotes, unquoted names,
  //    hexadecimal and octal numbers, NaN and Infinity, a lone comma read as "undefined").
  // ------------------------------------------------------------------------------------------------------------------

  function ReadError(message) { this.message = message; }

  var UNDEFINED = {undefinedToken: true};

  /** A number as Newtonsoft keeps it: an integer (exact, as a BigInt) or a float (a double). */
  function Num(kind, value) { this.kind = kind; this.value = value; }

  /** An object as JObject keeps it: a repeated name keeps its first place and its last value. */

        if (c != null && c.chance != null && (Number(c.chance) < 0 || Number(c.chance) > 1))
          blocking.push("consequence '" + (c.type == null ? '' : c.type) + "' has a chance of " + String(Number(c.chance)) + ', which must be from 0 to 1.');
      });
    });

    validateFlags(q, cosmetic);

    var binds = new Set(q.binds == null ? [] : Array.from(q.binds.keys()));
    (LISTS.GameBoundRoles || []).forEach(function (r) { binds.add(r); }); // bound by the game for every tale ({player}: tashmetu, 11/10/2026)
    var seen = [];
    strings(q, 'object:AuthoredQuest', []).forEach(function (s) {
      var m;
      PLACEHOLDER.lastIndex = 0;
      while ((m = PLACEHOLDER.exec(s)) !== null) if (!has(seen, m[1])) seen.push(m[1]);
    });
    seen.filter(function (p) { return !binds.has(p); }).forEach(function (p) {
      cosmetic.push('{' + p + '} is used but no role binds it (add it to "binds"), so it would reach the player as written.');
    });

    // The tale's content level (10/10/2026): a word that is no level is refused, as the game does.
    var content = q.requires == null ? null : q.requires.content;
    if (!blank(content) && !has(LISTS.ContentLevels || [], String(content).trim().toLowerCase()))
      blocking.push("requires.content '" + content + "' is no content level (" + (LISTS.ContentLevels || []).join(', ') + ').');

    // A tale that begins on the map (11/10/2026), refused as the game refuses it.
    var onMap = q.on_map;
    if (onMap != null && typeof onMap === 'object') {
      if (!(q.requires != null && q.requires.giver != null && q.requires.giver.with_player === true))
        blocking.push('on_map: the tale begins on the map, so its giver must travel with the player: set requires.giver.with_player to true.');
      var chance = onMap.chance_per_day == null ? 0.15 : Number(onMap.chance_per_day);
      if (chance <= 0 || chance > 1) blocking.push('on_map.chance_per_day ' + String(chance) + ' must be above 0 and at most 1.');
      var still = onMap.still_hours == null ? 3 : Number(onMap.still_hours);
      if (still < 0) blocking.push('on_map.still_hours ' + String(still) + ' cannot be below 0.');
      if (blank(onMap.invitation)) blocking.push('on_map.invitation is empty: the popup would ask the player nothing.');
    }

    // A tale only a scenario opens (24/10/2026): one way in, and a popup that says something.
    var onScenario = q.on_scenario;
    if (onScenario != null && typeof onScenario === 'object') {
      if (onMap != null && typeof onMap === 'object') blocking.push('on_scenario and on_map both say how the tale begins: keep one.');
      var declined = onScenario.decline_ending == null ? '' : String(onScenario.decline_ending).trim();
      if (blank(onScenario.invitation) && declined.length) cosmetic.push('on_scenario.decline_ending is never played: with no invitation there is no popup to say no to.');
      if (declined.length && !(q.endings != null && q.endings.has(declined))) blocking.push("on_scenario.decline_ending '" + declined + "' is not among \"endings\".");
    }

    // The giver's sex (11/10/2026): a word that is neither is refused, as the game does.
    var gender = q.requires == null || q.requires.giver == null ? null : q.requires.giver.gender;
    if (!blank(gender) && !has(LISTS.GiverGenders || [], String(gender).trim().toLowerCase()))
      blocking.push("requires.giver.gender '" + gender + "' is neither " + (LISTS.GiverGenders || []).join(' nor ') + '.');

    var rival = q.requires == null ? null : q.requires.rival;
    if (rival != null && !has(LISTS.RivalRoles, rival.role))
      blocking.push("requires.rival asks for a '" + (rival.role == null ? '' : rival.role) + "', but the game binds a rival only as a \"clan_leader\" of the giver's realm.");
    // The giver's husband (the Troy-inspired tale, 12/10/2026): a role the game binds, from a married giver.
    var husband = q.requires == null ? null : q.requires.husband;
    if (husband != null && !has(LISTS.HusbandRoles || [], husband.role))
      blocking.push("requires.husband asks for a '" + (husband.role == null ? '' : husband.role) + "', but the game binds a husband only as \"spouse_of_giver\".");
    if (husband != null && !(q.requires.giver != null && q.requires.giver.married === true))
      blocking.push("requires.husband binds the giver's husband, so requires.giver.married must be true.");
    if (rival != null && rival.same_realm_as !== '{giver}')
      blocking.push("requires.rival is of the same realm as '" + (rival.same_realm_as == null ? '' : rival.same_realm_as) + "', but the game binds a rival only in the giver's realm (\"{giver}\").");
  }

  /** Every band's on_defeat in the tale, with where it stands (a stage's own band, or a choice's). */
  function defeats(q) {
    var out = [];
    arr(q.stages).forEach(function (s) {
      if (s == null) return;
      var own = s.objective && s.objective.spawn ? s.objective.spawn.on_defeat : null;
      if (own != null) out.push({where: "stage '" + str(s.id) + "'", defeat: own});
      arr(s.choices).forEach(function (c) {
        var d = c && c.objective && c.objective.spawn ? c.objective.spawn.on_defeat : null;
        if (d != null) out.push({where: "stage '" + str(s.id) + "', choice '" + str(c.id) + "'", defeat: d});
      });
    });
    return out;
  }

  /** A defeat leads to one of the tale's endings, or nowhere (the tale goes on); never to a stage. */
  function validateDefeats(q, endings, blocking) {
    defeats(q).forEach(function (x) {
      var next = x.defeat.next;
      if (blank(next)) return;
      var ending = endingId(next);
      if (ending === null)
        blocking.push(x.where + ": on_defeat.next '" + next + "' must be an ending (\"end:<id>\"); leave it out and the tale goes on after a defeat.");
      else if (!endings.has(ending))
        blocking.push(x.where + ": on_defeat leads to ending '" + ending + "', which \"endings\" does not define.");
    });
  }

  function checkNext(what, next, ids, endings, blocking) {
    var ending = endingId(next);
    if (ending !== null) {
      if (!endings.has(ending)) blocking.push(what + " ending '" + ending + "', which \"endings\" does not define.");
    } else if (next !== REWARD && !ids.has(next)) blocking.push(what + " '" + next + "', which is no stage of this quest.");
  }

  function isSceneChoice(c) { return c.objective == null && c.said == null; }

  function validateChoiceStage(q, s, isFirst, ids, endings, blocking, cosmetic) {
    var where = "stage '" + str(s.id) + "'";
    if (isFirst)
      blocking.push(where + ' is the request, accepted in the conversation where the tale is offered, so it cannot offer choices (move them to the next stage).');

    var isScene = s.objective != null && s.objective.type === 'explore';
    var next = s.on_complete == null ? null : s.on_complete.next;
    var choices = s.choices.filter(function (c) { return c != null; });
    var sceneChoices = choices.filter(isSceneChoice);

    if (s.objective != null) {
      var defaultLeadsOn = isScene && sceneChoices.some(function (c) { return c.default; });
      if (blank(next)) {
        if (!isScene) blocking.push(where + ' has no on_complete.next (a stage id, "reward", or "end:<id>").');
        else if (!defaultLeadsOn)
          blocking.push(where + ': a scene with choices needs a way out when it closes with none taken: an on_complete.next, or one choice marked "default": true.');
      } else checkNext(where + ' leads to', next, ids, endings, blocking);

      validateObjective(where, s.objective, false, isScene && sceneChoices.length > 0, blocking, cosmetic);
    } else if (!blank(next))
      cosmetic.push(where + ' has no objective, so its on_complete.next is never used; its choices lead on.');

    var choiceIds = new Set();
    choices.forEach(function (c) {
      if (blank(c.id)) { blocking.push(where + ': a choice has no id.'); return; }
      if (choiceIds.has(c.id)) blocking.push(where + ": two choices are called '" + c.id + "'.");
      else choiceIds.add(c.id);
    });

    choices.filter(function (c) { return !blank(c.id); }).forEach(function (c) {
      var choice = where + ", choice '" + c.id + "'";
      if (blank(c.next)) blocking.push(choice + ' has no next (a stage id, "reward", or "end:<id>").');
      else checkNext(choice + ' leads to', c.next, ids, endings, blocking);

      if (c.objective != null && c.said != null)
        blocking.push(choice + ' has both an objective and a "said"; give it one way to be taken.');
      else if (c.objective != null)
        validateObjective(choice, c.objective, true, false, blocking, cosmetic);
      else if (c.said != null) {
        var to = c.said.to;
        if (blank(to) || blank(c.said.meaning))
          blocking.push(choice + ': "said" needs "to" (a role, "{giver}") and "meaning" (what the player\'s words must mean).');
        else if (!has(LISTS.SpeakingRoles, to.trim()))
          blocking.push(choice + " is said to '" + to + "', but a choice can be said only to " + LISTS.SpeakingRoles.join(' or ') + '.');
        else if (to.trim() === '{husband}' && (q.requires == null || q.requires.husband == null))
          blocking.push(choice + ' is said to {husband}, but no husband is bound: add "husband" to "requires".');
        else if (to.trim() === '{rival}' && (q.requires == null || q.requires.rival == null))
          blocking.push(choice + ' is said to {rival}, but no rival is bound: add "rival" to "requires".');
      } else if (!isScene)
        blocking.push(choice + ' has no way to be taken: give it an objective or a "said" (only a choice in an explore stage is taken in the scene).');
      else {
        if (blank(c.label)) blocking.push(choice + ' is made in a scene, so it needs a "label": the words the player picks it by.');
        if (!MARKER_NAME.test(c.id)) blocking.push(choice + ' is made in a scene, so its id may hold only letters, digits and _ (the narrator writes it in a marker).');
      }

      if (c.default && sceneChoices.indexOf(c) < 0)
        cosmetic.push(choice + ' is marked default, which only matters for a choice made in a scene.');
    });

    var defaults = sceneChoices.filter(function (c) { return c.default && !blank(c.id); });
    if (isScene && defaults.length > 0) {
      if (!blank(next))
        cosmetic.push(where + ": choice '" + defaults[0].id + "' is marked default, but a scene closed with no choice follows on_complete.next; the mark is unused.");
      else {
        if (defaults[0].if != null && defaults[0].if.length > 0)
          blocking.push(where + ": the default choice '" + defaults[0].id + "' cannot depend on flags, or the scene could close with nowhere to go.");
        if (defaults.length > 1) cosmetic.push(where + ": several choices are marked default; only the first, '" + defaults[0].id + "', is used.");
      }
    }

    if (s.objective == null && choices.length > 0 && choices.every(function (c) { return c.if != null && c.if.length > 0; }))
      cosmetic.push(q.failure != null && q.failure.days > 0
        ? where + ': every way out depends on flags; if none holds, the tale can only end when its time runs out.'
        : where + ': every way out depends on flags; if none holds, the tale can never end.');
  }

  /** Where a stage's ways out lead: its own objective's next, then each choice's. */
  function exits(s) {
    var out = [];
    var hasChoices = s.choices != null && s.choices.length > 0;
    if ((!hasChoices || s.objective != null) && s.on_complete != null && !blank(s.on_complete.next)) out.push(s.on_complete.next);
    if (hasChoices) s.choices.forEach(function (c) { if (c != null && !blank(c.next)) out.push(c.next); });
    // A defeat that ends the tale is a way out too: its ending is reached.
    var own = s.objective && s.objective.spawn ? s.objective.spawn.on_defeat : null;
    if (own != null && endingId(own.next) !== null) out.push(own.next);
    if (hasChoices) s.choices.forEach(function (c) {
      var d = c && c.objective && c.objective.spawn ? c.objective.spawn.on_defeat : null;
      if (d != null && endingId(d.next) !== null) out.push(d.next);
    });
    return out;
  }

  /** The paths of a tale: which stages the first one reaches, and which can reach an ending (also drawn by the story map). */
  function analyzePaths(q) {
    var endings = q.endings == null ? new Map() : q.endings;
    var stages = [], byId = new Set();
    arr(q.stages).forEach(function (s) { if (s != null && !blank(s.id) && !byId.has(s.id)) { byId.add(s.id); stages.push(s); } });
    var leads = new Map();
    stages.forEach(function (s) { leads.set(s.id, exits(s)); });
    function resolves(next) { return next === REWARD || (endingId(next) !== null && endings.has(endingId(next))); }

    var reachable = new Set(), queue = [];
    var head = arr(q.stages)[0];
    if (head != null && leads.has(head.id == null ? '' : head.id)) { reachable.add(head.id); queue.push(head.id); }
    while (queue.length > 0) leads.get(queue.shift()).forEach(function (n) { if (leads.has(n) && !reachable.has(n)) { reachable.add(n); queue.push(n); } });

    var unsure = new Set();
    stages.forEach(function (s) {
      if (missesANext(s) || leads.get(s.id).some(function (n) { return !resolves(n) && !leads.has(n); })) unsure.add(s.id);
    });

    var canEnd = new Set();
    for (var grew = true; grew;) {
      grew = false;
      stages.forEach(function (s) {
        if (canEnd.has(s.id)) return;
        if (unsure.has(s.id) || leads.get(s.id).some(function (n) { return resolves(n) || canEnd.has(n); })) { canEnd.add(s.id); grew = true; }
      });
    }

    var sure = !stages.some(function (s) { return reachable.has(s.id) && unsure.has(s.id); });
    return {stages: stages, leads: leads, reachable: reachable, canEnd: canEnd, resolves: resolves, unsure: unsure, sure: sure};
  }

  /** A stage, or one of its choices, that needs a next and has none (already refused, with its own message). */
  function missesANext(s) {
    var hasChoices = s.choices != null && s.choices.length > 0;
    if (!hasChoices) return blank(s.on_complete == null ? null : s.on_complete.next);
    if (s.choices.some(function (c) { return c != null && blank(c.next); })) return true;
    var defaultLeadsOn = s.objective != null && s.objective.type === 'explore'
      && s.choices.some(function (c) { return c != null && c.objective == null && c.said == null && c.default; });
    return s.objective != null && blank(s.on_complete == null ? null : s.on_complete.next) && !defaultLeadsOn;
  }

  function validatePaths(q, ids, endings, blocking, cosmetic) {
    var a = analyzePaths(q);
    if (a.stages.length === 0) return;

    a.stages.forEach(function (s) {
      if (!a.reachable.has(s.id)) {
        if (a.sure) cosmetic.push("stage '" + s.id + "' is never reached from the first stage, so it is never played.");
      } else if (!a.canEnd.has(s.id)) blocking.push("stage '" + s.id + "' can never reach an ending: every way out of it leads back without an exit.");
    });

    if (!a.sure) return;
    var reached = [];
    a.stages.forEach(function (s) { if (a.reachable.has(s.id)) reached = reached.concat(a.leads.get(s.id)); });
    if (q.on_scenario != null && typeof q.on_scenario === 'object' && !blank(q.on_scenario.decline_ending)) reached.push(END_PREFIX + String(q.on_scenario.decline_ending).trim());
    Array.from(endings.keys()).forEach(function (k) {
      if (!blank(k) && !has(reached, END_PREFIX + k)) cosmetic.push("ending '" + k + "' is never reached: no path leads to \"end:" + k + '".');
    });
    if (!has(reached, REWARD) && hasContent(q.reward))
      cosmetic.push('the reward is never reached: no path leads to "reward" (name it "end:<id>" in "endings", or lead a path to it).');
  }

  /** An outcome that says anything at all: it differs from a blank one (its days aside). */
  function hasContent(o) {
    if (o == null) return false;
    var blankOne = defaults('AuthoredOutcome');
    return !deepEqual(o, Object.assign(blankOne, {days: o.days}));
  }

  function deepEqual(a, b) {
    if (a === b) return true;
    if (a == null || b == null) return false;
    if (typeof a === 'number' && typeof b === 'number') return a === b || (isNaN(a) && isNaN(b));
    if (Array.isArray(a) && Array.isArray(b)) return a.length === b.length && a.every(function (x, k) { return deepEqual(x, b[k]); });
    if (a instanceof Map && b instanceof Map) {
      if (a.size !== b.size) return false;
      var bk = Array.from(b.keys()), ak = Array.from(a.keys());
      return ak.every(function (k, j) { return k === bk[j] && deepEqual(a.get(k), b.get(k)); });
    }
    if (typeof a === 'object' && typeof b === 'object') {
      var ka = Object.keys(a), kb = Object.keys(b);
      return ka.length === kb.length && ka.every(function (k) { return deepEqual(a[k], b[k]); });
    }
    return false;
  }

  function validateFlags(q, cosmetic) {
    var set = new Set(LISTS.BuiltInFlags || []), tested = [];
    // What the tale already lived with this giver (TaleHistory, Gabriel 26/10/2026): played_before, and ended_before:<ending>.
    ['played_before', 'ended_before:reward', 'ended_before:failure'].forEach(function (f) { set.add(f); });
    if (q.endings != null) Array.from(q.endings.keys()).forEach(function (k) { set.add('ended_before:' + k); });
    function tests(conditions) {
      arr(conditions).forEach(function (c) {
        var name = (c == null ? '' : c).trim().replace(/^!+/, '').trim();
        if (!has(tested, name)) tested.push(name);
      });
    }
    function lines(ls) { arr(ls).forEach(function (l) { if (l != null) tests(l.if); }); }
    function knowers(k) { entries(k).forEach(function (e) { lines(e[1]); }); }
    function sets(list) { arr(list).forEach(function (f) { set.add(f); }); }

    q.stages.forEach(function (s) {
      if (s == null) return;
      lines(s.canvas);
      lines(s.facts);
      knowers(s.knowers);
      var scene = s.objective == null ? null : s.objective.scene;
      var arcOf = s.objective == null ? null : s.objective.arc;
      if (arcOf != null) {
        arr(arcOf.signals).forEach(function (sig) { if (sig != null && !blank(sig.id)) set.add(String(sig.id).trim()); });
        arr(arcOf.beats).forEach(function (b) { if (b != null) arr(b.next).forEach(function (n) { if (n != null) tests(n.if); }); });
      }
      if (scene != null) {
        arr(scene.findings).forEach(function (f) { if (f != null) sets(f.sets); });
        arr(scene.encounters).forEach(function (e) { if (e != null) sets(e.sets); });
      }
      arr(s.on_enter).forEach(function (c) { if (c != null) tests(c.if); });
      arr(s.choices).forEach(function (c) {
        if (c == null) return;
        tests(c.if);
        sets(c.sets);
        lines(c.canvas);
        lines(c.facts);
        knowers(c.knowers);
      });
    });

    [q.reward, q.failure].concat(Array.from((q.endings == null ? new Map() : q.endings).values())).forEach(function (o) {
      if (o == null) return;
      arr(o.consequences).forEach(function (c) { if (c != null) tests(c.if); });
    });

    tested.forEach(function (name) {
      if (name.length === 0) cosmetic.push('a flag test is empty; write a flag\'s name, or "!name" for not set.');
      else if (!set.has(name)) cosmetic.push("flag '" + name + "' is tested but never set anywhere, so \"" + name + '" never holds and "!' + name + '" always does.');
    });
  }

  // Gabriel (25/10/2026): an arc paces the conversation that IS the stage, so it lives on that talk_to alone (TaleArc).
  function validateArc(where, o, ofChoice, blocking) {
    var arc = o.arc;
    if (ofChoice) blocking.push(where + ': an "arc" paces a stage\'s own conversation; a choice cannot carry one.');
    if (String(o.when == null ? '' : o.when).trim().toLowerCase() !== 'closed') blocking.push(where + ': an "arc" needs "when": "closed", so the whole conversation is the stage.');
    if (!Array.isArray(arc.beats) || arc.beats.length === 0) {
      blocking.push(where + ': the arc has no beats.');
      return;
    }
    var ids = {};
    arc.beats.forEach(function (b, i) {
      var at = where + ', arc beat ' + (i + 1);
      if (b == null) { blocking.push(at + ' is empty.'); return; }
      if (blank(b.id)) blocking.push(at + ' has no "id".');
      else if (ids[String(b.id).trim()]) blocking.push(at + " repeats the id '" + b.id + "'.");
      else ids[String(b.id).trim()] = true;
      var n = Number(b.exchanges == null ? 0 : b.exchanges);
      if (!(n >= 1 && n <= 20)) blocking.push(at + ' needs "exchanges" from 1 to 20.');
      if (!blank(b.lead) && !has(LISTS.ArcLeads, String(b.lead).trim().toLowerCase()))
        blocking.push(at + ': "lead" ' + "'" + b.lead + "' is neither " + LISTS.ArcLeads.join(' nor ') + '.');
      if (blank(b['do'])) blocking.push(at + ' needs "do", the direction for the beat.');
    });
    var signals = {};
    arr(arc.signals).forEach(function (s, i) {
      var at = where + ', arc signal ' + (i + 1);
      if (s == null) { blocking.push(at + ' is empty.'); return; }
      if (blank(s.id)) blocking.push(at + ' has no "id".');
      else if (String(s.id).trim() === 'turned') blocking.push(at + ": 'turned' is the game's own signal (the player turning the scene); choose another id.");
      else if (signals[String(s.id).trim()]) blocking.push(at + " repeats the id '" + s.id + "'.");
      else signals[String(s.id).trim()] = true;
      if (blank(s.means)) blocking.push(at + ' needs "means", what the reply must show.');
      if (s.net != null && (Number(s.net.after || 0) < 0 || Number(s.net.chance || 0) < 0 || Number(s.net.chance || 0) > 1))
        blocking.push(at + ': "net" needs "after" of 0 or more and "chance" between 0 and 1.');
    });
    var loops = false;
    arc.beats.forEach(function (b, i) {
      if (b == null) return;
      var at = where + ', arc beat ' + (i + 1);
      arr(b.listens).forEach(function (l) {
        if (!signals[String(l == null ? '' : l).trim()]) blocking.push(at + " listens to '" + l + "', which is not one of the arc's signals.");
      });
      arr(b.next).forEach(function (n) {
        var to = String(n == null || n.to == null ? '' : n.to).trim();
        if (to === 'close') return;
        var j = -1;
        arc.beats.forEach(function (x, k) { if (j < 0 && x != null && String(x.id == null ? '' : x.id).trim() === to) j = k; });
        if (j < 0) blocking.push(at + ': "next" goes to ' + "'" + (n == null || n.to == null ? '' : n.to) + "', which is neither one of its beats nor \"close\".");
        else if (j <= i) loops = true;
      });
    });
    entries(arc.on_signal).forEach(function (e) {
      var key = e[0], to = String(e[1] == null ? '' : e[1]).trim();
      if (!signals[String(key == null ? '' : key).trim()]) blocking.push(where + ': the arc\'s "on_signal" names ' + "'" + key + "', which is not one of its signals.");
      if (to !== 'close' && !ids[to]) blocking.push(where + ': the arc\'s "on_signal" for ' + "'" + key + "' goes to '" + (e[1] == null ? '' : e[1]) + "', which is neither one of its beats nor \"close\".");
      else if (to !== 'close') loops = true;
    });
    if (loops && !(Number(arc.max_exchanges || 0) > 0)) blocking.push(where + ': the arc can go back to a beat already played, so it needs "max_exchanges" to be sure it ends.');
    if (!blank(arc.final) && !ids[String(arc.final).trim()]) blocking.push(where + ': the arc\'s "final" ' + "'" + arc.final + "' is not one of its beats.");
    if (Number(arc.max_exchanges || 0) < 0) blocking.push(where + ': the arc\'s "max_exchanges" cannot be negative.');
  }

          var name = hm[1].toLowerCase(), args = text.substring(k + hm[0].length, close), after = close + 1, hookEnd = -1;
          // A hook belongs to its macro only when it follows it at once (Harlowe's own rule); (set:) never takes one.
          if (text[after] === '[' && name !== 'set' && name !== 'put') hookEnd = closing(text, after, '[', ']');
          var hook = hookEnd >= 0 ? text.substring(after + 1, hookEnd) : null;
          // (if: $x)[[Go->There]]: Harlowe reads the doubled brackets as a link under the condition.
          if (hook !== null && /^\[[^\[\]]*\]$/.test(hook)) hook = '[' + hook + ']';
          var next = hookEnd >= 0 ? hookEnd + 1 : after;

          if (name === 'set' || name === 'put') {
            if (name === 'put') notes.push(where + ': (put:) is read as (set:).');
            setFlags(name === 'put' ? args.replace(/^\s*(.+?)\s+into\s+(\$\w+)\s*$/, '$2 to $1') : args);
            lastIf = null;
          } else if ((name === 'if' || name === 'unless' || name === 'else-if' || name === 'elseif') && hook !== null) {
            var c = condition(args);
            if (c === null || name === 'else-if' || name === 'elseif') {
              notes.push(where + ': (' + name + ': ' + args.trim() + ') is more than a flag; what it holds was kept with no condition.');
              walk(hook, currentCond());
              lastIf = null;
            } else {
              if (name === 'unless') c = negate(c);
              walk(hook, currentCond().concat([c]));
              lastIf = c;
            }
          } else if (name === 'else' && hook !== null) {
            if (lastIf === null) { notes.push(where + ': an (else:) follows no simple (if:); what it holds was kept with no condition.'); walk(hook, currentCond()); }
            else walk(hook, currentCond().concat([negate(lastIf)]));
            lastIf = null;
          } else if (name === 'link-goto' || name === 'link-reveal-goto') {
            var parts = args.split(/,(?=(?:[^"']|"[^"]*"|'[^']*')*$)/).map(unquote);
            out.links.push({label: parts[0], target: parts[1] || parts[0], if: currentCond().slice()});
            if (hook !== null) walk(hook, currentCond());
            lastIf = null;
          } else {
            notes.push(where + ': (' + name + ': ' + args.trim() + ') is not mapped; it was left out' + (hook !== null ? ', and what its hook holds kept as plain text.' : '.'));
            if (hook !== null) walk(hook, currentCond());
            lastIf = null;
          }
          k = next;
          continue;
        }

        // A SugarCube macro: <<name ...>>
        if (text.startsWith('<<', k)) {
          var mend = text.indexOf('>>', k + 2);
          if (mend < 0) { buffer += text.substring(k); break; }
          flush();
          var body = text.substring(k + 2, mend).trim(), sm = /^(\/?[\w-]+)\s*([\s\S]*)$/.exec(body) || ['', body, ''];
          var mname = sm[1].toLowerCase(), margs = sm[2];
          k = mend + 2;
          if (mname === 'set') setFlags(margs);
          else if (mname === 'if') {
            var ic = condition(margs);
            if (ic === null) notes.push(where + ': <<if ' + margs.trim() + '>> is more than a flag; what it holds was kept with no condition.');
            stack.push({base: currentCond(), conds: ic === null ? [] : [ic], cond: ic === null ? currentCond() : currentCond().concat([ic])});
          } else if (mname === 'elseif') {
            notes.push(where + ': <<elseif ' + margs.trim() + '>> is not mapped; what it holds was kept with no condition of its own.');
            if (stack.length) { var f1 = stack[stack.length - 1]; f1.cond = f1.base.concat(f1.conds.map(negate)); }
          } else if (mname === 'else') {
            if (stack.length) { var f2 = stack[stack.length - 1]; f2.cond = f2.base.concat(f2.conds.map(negate)); }
          } else if (mname === '/if') stack.pop();
          else if (mname === 'link' || mname === 'button') {
            var lk = /^\[\[([\s\S]*)\]\]\s*$/.exec(margs.trim());
            if (lk) { var l2 = parseLink(lk[1]); l2.if = currentCond().slice(); out.links.push(l2); }
            else {
              var q = margs.match(/"[^"]*"|'[^']*'/g) || [];
              if (q.length >= 2) out.links.push({label: unquote(q[0]), target: unquote(q[1]), if: currentCond().slice()});
              else notes.push(where + ': <<' + mname + ' ' + margs.trim() + '>> leads nowhere the import can read; it was left out.');
            }
          } else if (mname === '/link' || mname === '/button') { /* the end of a link's body */ }
          else notes.push(where + ': <<' + body + '>> is not mapped; it was left out.');

        }

        buffer += text[k++];
      }
      flush();
    }

    walk(p.text, []);
    return out;
  }

  // ------------------------------------------------------------------------------------------------------------------
  // 3. What a passage says: its lines by convention, and its tags.
  // ------------------------------------------------------------------------------------------------------------------

  var KNOWER = /^\s*(\{[a-z_]+\}|locals_of:\{[a-z_]+\})\s+knows\s*:\s*(.+)$/i;

  function clean(text) {
    return text.replace(/<[^>]+>/g, '').replace(/''|\/\/|\*\*|~~/g, '').replace(/[ \t]+/g, ' ');
  }

  function lines(passage) {
    var out = {canvas: [], facts: [], knowers: new Map(), journal: null, memory: null, closing: null, trigger: null};
    var paragraph = [];
    function endParagraph(cond) {
      var t = paragraph.join(' ').replace(/\s+/g, ' ').trim();
      if (t) out.canvas.push({text: t, if: cond});

    }
    passage.pieces.forEach(function (piece) {
      var cond = piece.if;
      clean(piece.text).split('\n').forEach(function (raw, k, all) {
        var line = raw.trim(), m;
        if (!line) { endParagraph(cond); return; }
        if ((m = /^journal\s*:\s*(.+)$/i.exec(line))) { endParagraph(cond); out.journal = m[1].trim(); return; }
        if ((m = /^fact\s*:\s*(.+)$/i.exec(line))) { endParagraph(cond); out.facts.push({text: m[1].trim(), if: cond}); return; }
        if ((m = /^memory\s*:\s*(.+)$/i.exec(line))) { endParagraph(cond); out.memory = m[1].trim(); return; }
        if ((m = /^closing\s*:\s*(.+)$/i.exec(line))) { endParagraph(cond); out.closing = m[1].trim(); return; }
        if ((m = /^trigger\s*:\s*(.+)$/i.exec(line))) { endParagraph(cond); out.trigger = m[1].trim(); return; }
        if ((m = KNOWER.exec(line))) {
          endParagraph(cond);
          if (!out.knowers.has(m[1])) out.knowers.set(m[1], []);
          out.knowers.get(m[1]).push({text: m[2].trim(), if: cond});
          return;
        }
        paragraph.push(line);
        if (k === all.length - 1) endParagraph(cond);
      });
      endParagraph(cond);
    });
    return out;
  }

  var ACTS = ['talk_to', 'return', 'talk_to_locals', 'be_at', 'keep_watch', 'defeat_party', 'wait'];

  function role(name) { return '{' + (name || 'giver').toLowerCase() + '}'; }

  function range(s, fallback) {
    var m = /^(\d+)-(\d+)$/.exec(s || '');
    return m ? [parseInt(m[1], 10), parseInt(m[2], 10)] : fallback;
  }

  function readTags(p, slug, notes) {
    var where = "passage '" + p.name + "'", info = {act: null, explore: false, finding: false, required: false, hazard: null, hp: null,
      encounter: false, isDefault: false, regard: null, gold: null};
    p.tags.forEach(function (tag) {
      var parts = tag.split(':'), head = parts[0].toLowerCase(), m;
      if (ACTS.indexOf(head) >= 0) {
        if (info.act) { notes.push(where + ': it already says how the player gets there; tag "' + tag + '" was left out.'); return; }
        switch (head) {
          case 'talk_to': info.act = {type: 'talk_to', hero: role(parts[1])}; break;
          case 'return': info.act = {type: 'return'}; break;
          case 'talk_to_locals': info.act = {type: 'talk_to_locals', place: role(parts[1] || 'village'), count: parseInt(parts[2], 10) || 1}; break;
          case 'be_at':
            info.act = {type: 'be_at', place: role(parts[1] || 'village')};
            if (parts[2]) info.act.radius = parseFloat(parts[2]);
            break;
          case 'keep_watch':
            info.act = {type: 'keep_watch', place: role(parts[1] || 'village'), nights: range(parts[2], [2, 5]), chance: parts[3] ? parseFloat(parts[3]) : 0.35};
            if (!parts[2]) notes.push(where + ': keep_watch was given the nights 2 to 5 and a chance of 0.35 a night; change them in the editor.');
            break;
          case 'defeat_party':
            info.act = {type: 'defeat_party', spawn: {id: slug, name: p.name, near: role(parts[1] || 'village'), size: range(parts[2], [10, 16])}};
            if (!parts[2]) notes.push(where + ': the band was given 10 to 16 men; change it in the editor.');
            break;
          case 'wait':
            info.act = {type: 'wait', days: parseInt(parts[1], 10) || 1};
            break;
        }
        return;
      }
      if (head === 'explore' || head === 'scene') info.explore = true;
      else if (head === 'finding') info.finding = true;
      else if (head === 'required') info.required = true;
      else if (head === 'hazard') info.hazard = info.hazard || 'injure';
      else if (head === 'injure' || head === 'alert' || head === 'lose_time') info.hazard = head;
      else if (head === 'hp') info.hp = range(parts[1], null);
      else if (head === 'encounter') info.encounter = true;
      else if (head === 'default') info.isDefault = true;
      else if (head === 'ending') { /* every passage with no links is an ending already */ }
      else if ((head === 'regard' || head === 'gold') && (m = /^[+-]?\d+$/.exec(parts[1] || ''))) info[head] = parseInt(m[0], 10);
      else notes.push(where + ': tag "' + tag + '" is not understood; it was left out.');
    });

  }

  // ------------------------------------------------------------------------------------------------------------------
  // 4. The tale.
  // ------------------------------------------------------------------------------------------------------------------

  function slugify(name) {
    var s = name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
    return s || 'passage';
  }

  function importText(text, fileName) {
    var notes = [];
    var story = /<tw-storydata\b/i.test(text) ? readHtml(text, notes) : readTwee(text, notes);
    if (!story.start) throw new Error('The story has no passages.');
    if (story.format && !/harlowe|sugarcube/i.test(story.format))
      notes.push('The story is written for ' + story.format + "; only Harlowe's and SugarCube's links, (set:) and (if:) are read.");

    var byName = new Map(), slugs = new Set();
    story.passages.forEach(function (p) {
      if (byName.has(p.name)) { notes.push("Two passages are called '" + p.name + "'; only the first is imported."); return; }
      var s = slugify(p.name), base = s, n = 2;
      while (slugs.has(s)) s = base + '_' + n++;
      slugs.add(s);

      read.slug = s;
      read.info = readTags(p, s, notes);
      read.lines = lines(read);

    var start = byName.get(story.start.name);
    var reached = new Set([start.name]), queue = [start];
    while (queue.length) {
      var at = queue.shift();
      at.links = at.links.filter(function (l) {
        if (byName.has(l.target)) return true;
        notes.push("passage '" + at.name + "': its link \"" + l.label + "\" leads to '" + l.target + "', which is no passage; it was left out.");
        return false;
      });

    }
    byName.forEach(function (p) { if (!reached.has(p.name)) notes.push("passage '" + p.name + "' is never linked from the start; it was not imported."); });

    var stages = [], made = new Map(), endings = {}, choiceIds = new Map();

    function isBeat(p) { return p.info.finding || p.info.hazard !== null || p.info.encounter; }
    function target(l) { return byName.get(l.target); }
    function plain(ls) { return ls.map(function (l) { return l.if.length ? {text: l.text, if: l.if.length === 1 ? l.if[0] : l.if.slice()} : l.text; }); }

    /** The journal line of the way toward a passage: its own "Journal:" line (for an ending, that line closes the tale instead). */
    function journalToward(t, label) { return t.lines.journal && ways(t).length > 0 ? t.lines.journal : sentence(label); }

    function say(o, p) {
      if (p.lines.canvas.length && !p.info.explore) o.canvas = plain(p.lines.canvas).length === 1 ? plain(p.lines.canvas)[0] : plain(p.lines.canvas);
      if (p.lines.facts.length && !p.info.explore) o.facts = plain(p.lines.facts);
      if (p.lines.knowers.size) o.knowers = knowersOf(p);
      return o;
    }

    function ending(p) {
      if (!(p.slug in endings)) {
        var e = {};
        if (p.info.regard !== null) e.regard = p.info.regard;
        if (p.info.gold !== null) e.gold = p.info.gold;
        if (p.lines.memory) e.memory = p.lines.memory;
        if (p.lines.journal) e.journal = p.lines.journal;
        endings[p.slug] = e;
      }
      return 'end:' + p.slug;
    }

    /** Where the story goes once this passage has happened. */
    function after(p) {
      var w = ways(p);
      if (p.info.explore) return scene(p);
      if (w.length === 0) return ending(p);
      if (w.length === 1 && w[0].if.length === 0) {
        var t = target(w[0]);
        if (!t.info.act && t.info.explore) return after(t);
      }
      return decision(p, p === start ? p.slug + '_after' : p.slug);
    }

    function uniqueChoiceId(stageId, id) {
      if (!choiceIds.has(stageId)) choiceIds.set(stageId, new Set());
      var used = choiceIds.get(stageId), s = id, n = 2;
      while (used.has(s)) s = id + '_' + n++;
      used.add(s);
      return s;
    }

    function noAct(p, from) {
      notes.push("passage '" + p.name + "' has no tag saying what the player does to get there (talk_to:giver, be_at:village, wait:3...), so the way from '"
        + from.name + "' cannot be taken yet; give it one in the editor.");
    }

    function decision(p, id) {
      if (made.has(id)) return id;
      var stage = {id: id};
      made.set(id, stage);
      stages.push(stage);
      var w = ways(p);
      var t0 = target(w[0]);
      if (w.length === 1 && w[0].if.length === 0 && t0.sets.length === 0) {
        stage.journal = journalToward(t0, w[0].label);
        if (t0.info.act) stage.objective = t0.info.act; else noAct(t0, p);
        say(stage, t0);
        stage.on_complete = {next: after(t0)};
        return id;
      }
      stage.choices = w.map(function (l) {
        var t = target(l), c = {id: uniqueChoiceId(id, t.slug), label: l.label, journal: journalToward(t, l.label)};
        if (flagsOf(l.if)) c.if = flagsOf(l.if);
        if (t.sets.length) c.sets = t.sets.length === 1 ? t.sets[0] : t.sets.slice();
        if (t.info.act) {
          c.objective = t.info.act;
          if (t.info.act.type === 'keep_watch')
            notes.push("passage '" + t.name + "': a way out among several cannot keep watch (the game counts nights only for a stage's own watch); make it the only link of '" + p.name + "', or lead it to a passage that does.");
        } else noAct(t, p);
        say(c, t);
        c.next = after(t);
        return c;
      });
      return id;
    }

    function scene(p) {
      if (made.has(p.slug)) return p.slug;
      var stage = {id: p.slug};
      made.set(p.slug, stage);
      stages.push(stage);
      if (p.lines.journal) stage.journal = p.lines.journal;
      else stage.journal = sentence(p.name);
      if (p.lines.canvas.some(function (l) { return l.if.length; }))
        notes.push("passage '" + p.name + "': a scene's opening cannot depend on flags; its lines were kept with no condition.");
      var sc = {title: p.name, opening: {canvas: p.lines.canvas.map(function (l) { return l.text; }).join(' ')}};
      if (p.lines.facts.length) sc.opening.facts = p.lines.facts.map(function (l) { return l.text; });
      var findings = [], hazards = [], encounters = [];
      p.links.forEach(function (l) {
        var t = target(l);
        if (!isBeat(t)) return;
        var body = t.lines.canvas.map(function (x) { return x.text; }).join(' ');
        if (t.info.finding) {
          var f = {id: t.slug, required: t.info.required, text: body};
          if (t.sets.length) f.sets = t.sets.length === 1 ? t.sets[0] : t.sets.slice();
          findings.push(f);
        } else if (t.info.hazard) {
          var h = {id: t.slug, trigger: t.lines.trigger || l.label.charAt(0).toLowerCase() + l.label.substring(1), effect: {type: t.info.hazard}};
          if (t.info.hazard === 'injure') h.effect.hit_points = t.info.hp || [10, 25];
          if (t.info.hazard === 'injure' && !t.info.hp) notes.push("passage '" + t.name + "': the hazard was given 10 to 25 hit points; change it in the editor (tag hp:10-25).");
          hazards.push(h);
        } else {
          var en = {id: t.slug, name: t.name, persona: body};
          if (t.lines.facts.length) en.knows = t.lines.facts.map(function (x) { return x.text; });
          if (t.sets.length) en.sets = t.sets.length === 1 ? t.sets[0] : t.sets.slice();
          encounters.push(en);
        }
      });
      if (findings.length) sc.findings = findings;
      if (hazards.length) sc.hazards = hazards;
      if (encounters.length) sc.encounters = encounters;
      if (p.lines.closing) sc.closing = p.lines.closing;
      stage.objective = {type: 'explore', scene: sc};
      say(stage, p);

      var w = ways(p);
      if (w.length === 0) {
        stage.on_complete = {next: ending(p)};
        return p.slug;
      }
      var chosenDefault = w.filter(function (l) { return target(l).info.isDefault; })[0];
      if (!chosenDefault) {
        chosenDefault = w.filter(function (l) { return l.if.length === 0; })[0];
        if (chosenDefault) notes.push("passage '" + p.name + "': no way out is tagged \"default\", so \"" + chosenDefault.label + '" is taken when the scene closes with none chosen.');
      }
      stage.choices = w.map(function (l) {
        var t = target(l), c = {id: uniqueChoiceId(p.slug, t.slug), label: l.label};
        if (flagsOf(l.if)) c.if = flagsOf(l.if);
        if (t.sets.length) c.sets = t.sets.length === 1 ? t.sets[0] : t.sets.slice();
        if (l === chosenDefault) c.default = true;
        c.next = arrival(t, l);
        return c;
      });
      return p.slug;
    }

    /** A way out of a scene leads here: straight on, or through a stage that waits for the passage's act. */
    function arrival(t, l) {
      if (!t.info.act) {
        if (ways(t).length === 0 && !t.info.explore && t.lines.canvas.length && !t.lines.journal)
          notes.push("passage '" + t.name + "': an ending reached straight from a scene has no conversation to say its text in; write what the journal should say on a \"Journal:\" line.");
        return after(t);
      }
      var id = t.slug + '_way';
      if (made.has(id)) return id;
      var stage = {id: id, journal: journalToward(t, l.label)};
      made.set(id, stage);
      stages.push(stage);
      stage.objective = t.info.act;
      say(stage, t);
      stage.on_complete = {next: after(t)};
      return id;
    }

    // The request: the start passage, said by the giver when the tale is offered.
    var request = {id: start.slug, journal: start.lines.journal || '{giver} has asked for your help.', objective: {type: 'talk_to', hero: '{giver}'}};
    if (start.info.act || start.info.explore) notes.push("passage '" + start.name + "' is the start, made in the conversation where the tale is offered; its tags were left out.");
    if (start.sets.length) notes.push("passage '" + start.name + "': flags cannot be set by the request itself; set them on the passage that follows.");
    stages.push(request);
    made.set(start.slug, request);
    say(request, start);
    start.info.explore = false;
    request.on_complete = {next: ways(start).length === 0 ? 'reward' : after(start)};
    if (ways(start).length === 0) notes.push("passage '" + start.name + "' links nowhere; the tale ends with its reward as soon as it is taken on.");

    // Roles the text uses, bound by the game: the giver always, the village and the rival when the story names them.
    var all = JSON.stringify(stages) + JSON.stringify(endings), used = [], m, re = /\{([a-z_]+)\}/g;
    while ((m = re.exec(all)) !== null) if (used.indexOf(m[1]) < 0) used.push(m[1]);
    var binds = {giver: 'the one who asks for help'};
    var requires = {giver: {role: 'lord'}};
    if (used.indexOf('village') >= 0) { binds.village = 'the village the tale happens in'; requires.giver.holds = '{village}'; requires.village = {type: 'village'}; }
    if (used.indexOf('rival') >= 0) { binds.rival = 'the head of another house of the giver\'s realm'; requires.rival = {role: 'clan_leader'}; }
    used.forEach(function (r) {
      if (!(r in binds)) {
        binds[r] = 'a role the game does not bind yet';
        notes.push('{' + r + '} is used, but the game binds only {giver}, {village} and {rival}; the player would read it as written.');
      }
    });

    var quest = {
      id: 'custom_' + slugify(story.title),
      title: story.title,
      author: 'imported from Twine' + (fileName ? ' (' + fileName + ')' : ''),
      requires: requires,
      binds: binds,
      stages: stages
    };
    if (Object.keys(endings).length) quest.endings = endings;
    notes.push('No time limit was set: the tale never fails on its own. Add one under Failure if it should.');
    return {quest: quest, notes: notes};
  }

  root.TwineImport = {importText: importText};
})(typeof globalThis !== 'undefined' ? globalThis : this);

<script id="editor-fields">
/* Calradia Remembers, the tale editor's field registry: every field of every part of a quest file, in the place the
   editor shows it. The mod's test suite holds this list to the schema generated from the game's model, so a field the
   game reads can never be left without a form. No DOM: Node reads this same list. */
(function (root) {
  'use strict';
  root.TaleEditorFields = {
    AuthoredQuest: ['id', 'title', 'author', 'unique', 'repeat_cooldown_days', 'weight', 'requires', 'on_map', 'on_scenario', 'binds', 'stages', 'reward', 'endings', 'failure'],
    AuthoredMapTrigger: ['still_hours', 'by_day', 'in_givers_lands', 'chance_per_day', 'invitation', 'accept', 'decline'],
    AuthoredScenarioTrigger: ['invitation', 'accept', 'decline', 'decline_ending'],

  // ================================================================================================================

  }

        {id: 'the_request', journal: '{giver} has asked for your help.', objective: {type: 'talk_to', hero: '{giver}'},

  function indexOfStage(id, nth) {

  /** Where a problem points: the tale, the part (a stage, a choice, an ending) and, when it can tell, the field. */

    if (/^it has no id/.test(m)) { p.key = 'tale/id'; return p; }
    if (/^an ending has no name/.test(m)) { p.key = 'tale/endings'; return p; }
    if ((x = /^ending '([^']*)' is never reached/.exec(m))) { p.key = 'ending:' + x[1]; return p; }

    if (/^requires\.rival/.test(m)) { p.key = 'tale/requires.rival'; return p; }
    if (/^requires\.husband/.test(m)) { p.key = 'tale/requires.husband'; return p; }
    if ((x = /^consequence '([^']*)'/.exec(m))) { p.key = outcomeWith(function (c) { return (c.type || '') === x[1]; }) + '/consequences'; return p; }

    if (/^a flag test is empty/.test(m)) { p.key = flagUse(''); return p; }

    if ((x = /^stage '((?:[^']|'(?![,: ]))*)'(?:, choice '((?:[^']|'(?![,: ]))*)')?/.exec(m))) {

  function ownBinds(t) { if (!t.binds || typeof t.binds !== 'object' || Array.isArray(t.binds)) t.binds = {}; return t.binds; }

  function bindsEditor(t) {
    var box = h('div');
    var keys = Object.keys(t.binds && typeof t.binds === 'object' ? t.binds : {});
    if (!keys.length) box.appendChild(h('p.empty-note', 'No role yet. Most tales need at least {giver}.'));
    keys.forEach(function (k) {
      var name = h('input', {type: 'text', class: 'mono', value: k, 'aria-label': 'Role name'});
      name.addEventListener('change', function () {
        var nk = name.value.trim().replace(/^\{|\}$/g, '');
        if (!nk || nk === k) { name.value = k; return; }
        if (t.binds.hasOwnProperty(nk)) { toast('{' + nk + '} is already listed.', 'error'); name.value = k; return; }
        edit('tale/binds', function () { var nb = {}; Object.keys(t.binds).forEach(function (x) { nb[x === k ? nk : x] = t.binds[x]; }); t.binds = nb; }, true);

      box.appendChild(h('div.kv-row', name, textInput('tale/binds', t.binds[k], function (v) { t.binds[k] = v; }, {placeholder: 'who or what this role is'}),

    });
    var missing = ['giver', 'village', 'rival'].filter(function (x) { return keys.indexOf(x) < 0; });

    }), h('button.btn.small', {type: 'button', on: {click: function () { edit('tale/binds', function () { ownBinds(t)[uniqueName('role', Object.keys(ownBinds(t)))] = ''; }, true); }}}, icon('plus'), 'Another role')));
    box.appendChild(h('p.help', 'The game fills {giver}, {village} (with "The village" above) and {rival} (with "A rival" above). Any other role would reach the player as written.'));

    box.appendChild(boolField(k + '.invite_prisoners', 'Your prisoners may be invited', 'AuthoredScene', 'invite_prisoners', sc));

  }

  function spawnEditor(key, o) {

  /** If the player loses to the band: an ending, or the tale goes on with what the defeat leaves. */

  /** A list of cards (findings, hazards, encounters, choices, consequences), each with its tools. */
  function cardList(key, title, intro, holder, propKey, describe, make, addLabel, opts) {
    opts = opts || {};
    var wrap = h('div.field.wide', {dataset: {key: key}});

    var listBox = h('div.list');
    items.forEach(function (item, i) {
      if (!item || typeof item !== 'object') { listBox.appendChild(h('p.empty-note', '(an empty entry)')); return; }

        iconButton('up', 'Move up', function () { edit(key, function () { var a = holder[propKey]; var t = a[i - 1]; a[i - 1] = a[i]; a[i] = t; }, true); }, {disabled: i === 0}),
        iconButton('down', 'Move down', function () { edit(key, function () { var a = holder[propKey]; var t = a[i + 1]; a[i + 1] = a[i]; a[i] = t; }, true); }, {disabled: i === items.length - 1}),
        iconButton('trash', 'Remove', function () { edit(key, function () { holder[propKey].splice(i, 1); if (!holder[propKey].length && !opts.keepEmpty) delete holder[propKey]; }, true); }, {danger: true})));
      card.appendChild(h('div.card-body', d.body));
      card.appendChild(h('div.field-problems', {style: 'padding:0 12px 10px'}));
