    if (!items.length) listBox.appendChild(h('p.empty-note', opts.empty || 'None yet.'));
    wrap.appendChild(listBox);
    wrap.appendChild(h('button.btn.small', {type: 'button', on: {click: function () { edit(key, function () { if (!Array.isArray(holder[propKey])) holder[propKey] = []; holder[propKey].push(make()); }, true); }}}, icon('plus'), addLabel));
    return wrap;
  }

  // ---------- a stage ----------
  // Previews of the images picked this session, by file name. Never saved: the tale names the file, the file sits
  // in the tale's own folder beside its JSON (Gabriel, 08/10/2026).
  var imagePreviews = {};

  /** A stage's image. */
  function stageImageField(key, s) {
    return imageField(key, s, 'AuthoredStage', 'Image (beside the chat in this stage\'s scene and conversations)');
  }

  /** An image: its file name, a picker that fills it and shows the picture, and the preview. */
  function imageField(key, s, defName, label) {
    // Gabriel (08/10/2026): the picture only. A button of our own stands for the browser's file input, so "No file
    // chosen" shows only when no image is chosen; the file's name shows only when its picture cannot be (a tale
    // reopened: the page cannot read the disk by itself).
    var input = h('input', {type: 'file', accept: '.png,.jpg,.jpeg,.crvid', style: 'display:none', on: {change: function (e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      // Gabriel (11/10/2026): a picture may be a video (.crvid, made by Tools/Video/make_crvid.py); its first frame is its
      // picture in the game. The page names it; it does not play it.
      if (/\.crvid$/i.test(file.name)) { edit(key + '/image', function () { s.image = file.name; }, true); return; }
      var reader = new FileReader();
      reader.onload = function () {
        imagePreviews[file.name] = String(reader.result);
        edit(key + '/image', function () { s.image = file.name; }, true);
      };
      reader.readAsDataURL(file);
    }}});
    var url = s.image ? imagePreviews[s.image] : null;
    var row = h('div', {style: 'display:flex;gap:8px;align-items:center;margin-top:4px'},
      h('button.btn', {type: 'button', on: {click: function () { input.click(); }}}, s.image ? 'Change image or video...' : 'Choose image or video...'),
      s.image
        ? h('button.btn.ghost', {type: 'button', on: {click: function () { edit(key + '/image', function () { delete s.image; }, true); }}}, 'Remove')
        : h('span', {style: 'color:var(--text-3);font-size:13px'}, 'No file chosen'));
    var isVideo = s.image && /\.crvid$/i.test(s.image);
    var shown = isVideo
      ? h('p.empty-note', s.image + ": a video. It plays beside the chat in the game, once, then rests on its first frame (PLAY, STOP and LOOP below it). It must sit in the tale's own folder, beside its JSON.")
      : url
      ? h('img', {src: url, alt: s.image, style: 'max-width:100%;max-height:220px;border-radius:6px;margin-top:8px;display:block'})
      : s.image ? h('p.empty-note', s.image + ': choose it again to see it here. It must sit in the tale\'s own folder, beside its JSON.') : null;
    return field(key + '/image', label, defName, 'image', h('div', input, row, shown), {wide: true});
  }

  function stageEditor(i) {
    var s = stages()[i];
    if (!s || typeof s !== 'object') return h('div.editor', h('p.empty-note', 'This stage is empty in the file.'));
    var key = 'stage:' + i, isFirst = i === 0;
    var isScene = s.objective && s.objective.type === 'explore';
    var ed = h('div.editor');
    ed.appendChild(editorHead(isFirst ? 'Stage 1, the request' : 'Stage ' + (i + 1) + ' of ' + stages().length, s.id || '(no id)',
      isFirst ? 'The request itself: completed when the player accepts the tale in the conversation where it is offered. What the giver says then is this stage\'s canvas and facts.' : null,
      [iconButton('up', 'Move this stage up', function () { moveStage(i, -1); }, {disabled: i === 0}),
       iconButton('down', 'Move this stage down', function () { moveStage(i, 1); }, {disabled: i === stages().length - 1}),
       iconButton('dup', 'Duplicate this stage', function () { duplicateStage(i); }),
       iconButton('trash', 'Delete this stage', function () { deleteStage(i); }, {danger: true})]));
    ed.appendChild(itemProblems(key));

    var idInput = textInput(key + '/id', s.id, function (v) { s.id = v; }, {mono: true});
    // Gabriel (25/10/2026): an image OR a pool, said plainly; the pool wins when both are filled.
    var pooled = [].concat(s.image_pool == null ? [] : s.image_pool).some(function (p) { return !blank(p); });
    ed.appendChild(section('Basics', null, [h('div.grid',
      field(key + '/id', 'Id', 'AuthoredStage', 'id', idInput, {help: help('AuthoredStage', 'id') + ' Renaming it updates every path that leads here.'}),
      textField(key + '/journal', 'Journal', 'AuthoredStage', 'journal', s, {wide: true}),
      stageImageField(key, s),
      flagsField(key + '/image_pool', 'OR an image pool (one per playing)', 'AuthoredStage', 'image_pool', s, {placeholder: 'night_1.crvid, night_2.crvid', wide: true}),
      selectField(key + '/image_pool_pick', 'The pool picks', 'AuthoredStage', 'image_pool_pick', s, list('ImagePoolPicks'), {empty: 'one not seen yet'})),
      h('p.help', pooled
        ? (blank(s.image) ? 'This stage shows a picture of its pool.' : 'Both are filled: a picture of the pool is shown and the image above never is. Keep one.')
        : 'One image, or a pool of several (one chosen each time the tale is played): not both.')]));

    var hasChoices = Array.isArray(s.choices) && s.choices.length > 0;
    var own = s.objective !== undefined && s.objective !== null;
    var body = [];
    if (hasChoices) {
      body.push(h('label.check', {style: 'margin-bottom:12px'}, h('input', {type: 'checkbox', checked: own, on: {change: function (e) {
        var on = e.target.checked;
        edit(key + '/objective', function () { if (on) s.objective = {type: 'talk_to', hero: '{giver}'}; else { delete s.objective; if (s.on_complete) delete s.on_complete; } }, true);
      }}}), 'This stage has an objective of its own, beside its choices'));
    }
    if (own || !hasChoices) {
      body.push(objectiveEditor(key, s, false, isScene));
      var leadsLabel = isScene ? 'When the scene closes with no choice made' : 'When it is done, the story goes to';
      body.push(h('div.grid', nextField(key + '/on_complete.next', leadsLabel, lazy(s, 'on_complete'), 'next', 'AuthoredOnComplete',
        {help: isScene && hasChoices ? 'Leave it empty to take the choice marked default instead.' : help('AuthoredOnComplete', 'next')})));
    }
    ed.appendChild(section('How the stage is completed', hasChoices ? 'A stage with choices is left by whichever way out comes first: its own objective, if it has one, or an open choice.' : null, body));

    // tashmetu (15/10/2026): consequences carried out as the tale enters this stage. Never on the first, the request.
    if (!isFirst || arr(s.on_enter).length > 0)
      ed.appendChild(section('When the tale enters this stage', help('AuthoredStage', 'on_enter'), consequenceCards(key + '/on_enter', s, 'on_enter'), {collapseKey: key + '/on_enter'}));

    ed.appendChild(section('What is said', 'Spoken by the giver in the conversation that completes this stage; knower lines reach the characters named, while the stage lasts.', [
      linesField(key + '/canvas', 'Canvas', 'AuthoredStage', 'canvas', s, {single: true, placeholder: 'How the moment feels.'}),
      linesField(key + '/facts', 'Facts', 'AuthoredStage', 'facts', s, {add: 'Add a fact', placeholder: 'What must stay true in anything said.'}),
      knowersField(key + '/knowers', s, 'AuthoredStage')], {collapseKey: key + '/said'}));

    ed.appendChild(section('Choices', isScene
      ? 'In a scene, a choice with no objective is offered to the player as a numbered list under the narration; the narrator takes it when the player\'s words do.'
      : help('AuthoredStage', 'choices'), choicesEditor(key, s, isScene, isFirst)));
    return ed;
  }

  function modeOf(c) { return c.said ? 'words' : c.objective ? 'act' : 'scene'; }

  function choicesEditor(key, s, isScene, isFirst) {
    if (isFirst && !(s.choices && s.choices.length)) return h('p.empty-note', 'The request cannot offer choices: put them on the next stage.');
    return cardList(key + '/choices', 'Ways out', null, s, 'choices', function (c, j, ck) {
      var mode = modeOf(c);
      var chips = [];
      if (c.if !== undefined && c.if !== null && [].concat(c.if).length) chips.push(h('span.chip', {title: 'Open only if'}, 'if ' + flagsToText(c.if)));
      if (c.default) chips.push(h('span.chip', 'default'));
      var modeSeg = h('div.seg', {role: 'group', 'aria-label': 'How it is taken'},
        [['act', 'By an act'], ['scene', 'In the scene'], ['words', 'By words']].map(function (m) {
          return h('button', {type: 'button', class: mode === m[0] ? 'on' : null, disabled: m[0] === 'scene' && !isScene ? true : null,
            title: m[0] === 'scene' && !isScene ? 'Only a stage that is a scene (explore) offers choices in the scene.' : null, on: {click: function () {
              edit(ck + '/mode', function () {
                if (m[0] === 'act') { delete c.said; c.objective = c.objective || {type: 'talk_to', hero: '{giver}'}; delete c.default; }
                else if (m[0] === 'scene') { delete c.said; delete c.objective; }
                else { delete c.objective; delete c.default; c.said = c.said || {to: '{giver}', meaning: ''}; }
              }, true);
            }}}, m[1]);
        }));
      var body = [
        h('div.grid',
          field(ck + '/id', 'Id', 'AuthoredChoice', 'id', textInput(ck + '/id', c.id, function (v) { c.id = v; }, {mono: true})),
          textField(ck + '/label', 'Label', 'AuthoredChoice', 'label', c),
          nextField(ck + '/next', 'Leads to', c, 'next', 'AuthoredChoice')),
        textField(ck + '/journal', 'Journal line', 'AuthoredChoice', 'journal', c, {wide: true}),
        field(ck + '/mode', 'How it is taken', null, null, modeSeg, {help: mode === 'act' ? 'The first act met wins; the other ways close.'
          : mode === 'scene' ? 'Listed under the narration; only the narrator\'s marker counts, never the click alone.'
            : 'Taken when the action interpreter hears the player say what it means, in a conversation with that character.'})
      ];
      if (mode === 'act') body.push(objectiveEditor(ck, c, true, false));
      if (mode === 'words') {
        var said = lazy(c, 'said');
        body.push(h('div.grid',
          selectField(ck + '/said.to', 'Said to', 'AuthoredSaid', 'to', said, list('SpeakingRoles'), {structural: false, empty: said.to ? undefined : '(choose)'}),
          textField(ck + '/said.meaning', 'Meaning', 'AuthoredSaid', 'meaning', said, {wide: true, multiline: true, short: true,
            placeholder: 'the player promises to keep silent for a price'})));
        body.push(h('div', {dataset: {key: ck + '/said'}}, h('div.field-problems')));
      }
      body.push(h('div.grid',
        flagsField(ck + '/if', 'Open only if', 'AuthoredChoice', 'if', c, {placeholder: 'always open'}),
        flagsField(ck + '/sets', 'Sets flags', 'AuthoredChoice', 'sets', c, {placeholder: 'none'}),
        mode === 'scene' || c.default ? boolField(ck + '/default', 'The default way out', 'AuthoredChoice', 'default', c, {structural: true}) : null));
      body.push(h('details', {open: (c.canvas || c.facts || c.knowers) ? true : null},
        h('summary', {style: 'cursor:pointer;color:var(--text-2);font-weight:600;font-size:12.5px;margin:4px 0 10px'}, 'What is said when this choice is taken'),
        linesField(ck + '/canvas', 'Canvas', 'AuthoredChoice', 'canvas', c, {single: true}),
        linesField(ck + '/facts', 'Facts', 'AuthoredChoice', 'facts', c, {add: 'Add a fact'}),
        knowersField(ck + '/knowers', c, 'AuthoredChoice')));
      return {title: c.label || c.id || '(no id)', subtitle: c.label && c.id ? c.id : null, chips: chips,
        chip: mode === 'act' ? 'by an act' + (c.objective && c.objective.type ? ': ' + c.objective.type : '') : mode === 'scene' ? 'in the scene' : 'by words',
        chipClass: mode, body: body};
    }, function () {
      var n = uniqueName('choice', arr(s.choices).map(function (x) { return x && x.id; }));
      return isScene ? {id: n, label: 'A way out', next: ''} : {id: n, label: 'A way out', objective: {type: 'talk_to', hero: '{giver}'}, next: ''};
    }, 'Add a choice', {itemKey: function (j) { return key + '/choice:' + j; }, empty: 'No choices: the stage is left by its own objective.'});
  }

  function moveStage(i, d) {
    edit('tale/stages', function () { var a = ownStages(); var t = a[i + d]; a[i + d] = a[i]; a[i] = t; }, true);
    state.sel = {kind: 'stage', index: i + d};
    render();
  }

  function duplicateStage(i) {
    var copy = JSON.parse(V.stringify(stages()[i]));
    copy.id = uniqueName((copy.id || 'stage') + '_copy', stages().map(function (x) { return x && x.id; })).replace(/_1$/, '');
    edit('tale/stages', function () { ownStages().splice(i + 1, 0, copy); }, true);
    state.sel = {kind: 'stage', index: i + 1};
    render();
  }

  function deleteStage(i) {
    var s = stages()[i];
    if (!confirm('Delete the stage \u2018' + (s && s.id) + '\u2019? Paths leading to it will lead nowhere until you point them elsewhere.')) return;
    edit('tale/stages', function () { ownStages().splice(i, 1); }, true);
    state.sel = stages().length ? {kind: 'stage', index: Math.max(0, i - 1)} : {kind: 'tale'};
    render();
  }

  function addStage() {
    var id = uniqueName('stage', stages().map(function (x) { return x && x.id; }));
    edit('tale/stages', function () { ownStages().push({id: id, objective: {type: 'talk_to', hero: '{giver}'}}); }, true);
    state.sel = {kind: 'stage', index: stages().length - 1};
    render();
  }

  function forEachNext(fn) {
    stages().forEach(function (s) {
      if (!s) return;
      if (s.on_complete && typeof s.on_complete === 'object') fn(s.on_complete, 'next');
      arr(s.choices).forEach(function (c) { if (c) fn(c, 'next'); });
      [s].concat(arr(s.choices)).forEach(function (x) {
        var d = x && x.objective && x.objective.spawn ? x.objective.spawn.on_defeat : null;
        if (d && typeof d === 'object') fn(d, 'next');
      });
    });
  }

  // ---------- an outcome: the reward, a named ending, the failure ----------
  function outcomeEditor(kind, name) {
    var t = tale(), o, key, title, crumb, intro;
    if (kind === 'reward') { o = lazy(t, 'reward'); key = 'reward'; title = 'The reward'; crumb = 'An ending';
      intro = 'The single success ending, where a path leads to "reward". Every tale written before endings existed ends here.'; }
    else if (kind === 'failure') { o = lazy(t, 'failure'); key = 'failure'; title = 'Failure'; crumb = 'When time runs out';
      intro = 'What the tale leaves when its time runs out before any ending is reached. Without days, the tale never fails on its own.'; }
    else { o = lazy(ownEndings(), name); key = 'ending:' + name; title = name; crumb = 'A named ending, reached by "end:' + name + '"'; intro = null; }

    var ed = h('div.editor');
    var tools = kind === 'ending' ? [iconButton('trash', 'Delete this ending', function () {
      if (!confirm('Delete the ending \u2018' + name + '\u2019? Paths leading to it will lead nowhere.')) return;
      edit('tale/endings', function () { delete ownEndings()[name]; if (!Object.keys(ownEndings()).length) delete t.endings; }, true);
      state.sel = {kind: 'tale'};
      render();
    }, {danger: true})] : null;
    ed.appendChild(editorHead(crumb, title, intro, tools));
    ed.appendChild(itemProblems(key));
    if (kind === 'ending') {
      var nameInput = h('input', {type: 'text', class: 'mono', value: name});
      nameInput.addEventListener('change', function () { renameEnding(name, nameInput.value.trim()); });
      ed.appendChild(section('Name', null, field(key + '/name', 'Name', null, null, nameInput, {help: 'Paths lead here with "end:' + name + '". Renaming it updates every one of them.'})));
    }
    ed.appendChild(section('What it leaves', null, h('div.grid',
      kind === 'failure' ? numberField(key + '/days', 'Days', 'AuthoredOutcome', 'days', o, {min: 0}) : null,
      numberField(key + '/regard', 'Regard', 'AuthoredOutcome', 'regard', o),
      numberField(key + '/gold', 'Gold', 'AuthoredOutcome', 'gold', o, {min: 0}),
      kind !== 'failure' && o.days !== undefined ? numberField(key + '/days', 'Days (only read on failure)', 'AuthoredOutcome', 'days', o, {min: 0}) : null,
      textField(key + '/memory', 'The giver remembers', 'AuthoredOutcome', 'memory', o, {multiline: true, short: true, wide: true}),
      textField(key + '/journal', 'Last journal line', 'AuthoredOutcome', 'journal', o, {wide: true}))));
    ed.appendChild(section('Consequences', help('AuthoredOutcome', 'consequences'), consequenceCards(key + '/consequences', o)));
    return ed;
  }

  /** The consequences an outcome or a defeat leaves (or a stage's on_enter carries out), as cards. */
  function consequenceCards(key, o, field) {
    return cardList(key, 'Consequences', null, o, field || 'consequences', function (c, i, ck) {
      var used = F.consequenceFields[c.type] || ['who', 'text', 'summary', 'magnitude', 'place', 'if'];
      var g = h('div.grid', selectField(ck + '/type', 'Type', 'AuthoredConsequence', 'type', c, list('ConsequenceTypes'), {empty: c.type ? undefined : '(choose)'}));
      var grudge = c.type === 'grudge', regard = c.type === 'regard';
      if (used.indexOf('who') >= 0) g.appendChild(roleField(ck + '/who', grudge ? 'Who holds it' : regard ? 'Whose regard' : 'Who remembers', 'AuthoredConsequence', 'who', c, grudge || regard ? {placeholder: '{giver}'} : {locals: true, placeholder: 'locals_of:{village}'}));
      if (used.indexOf('against') >= 0) g.appendChild(roleField(ck + '/against', 'Against whom', 'AuthoredConsequence', 'against', c, {placeholder: '{rival}'}));
      if (used.indexOf('magnitude') >= 0) g.appendChild(numberField(ck + '/magnitude', grudge ? 'How deep' : 'How loud', 'AuthoredConsequence', 'magnitude', c, {min: 0, max: 100}));
      if (used.indexOf('place') >= 0) g.appendChild(roleField(ck + '/place', 'Where', 'AuthoredConsequence', 'place', c, {placeholder: '{village}'}));
      if (used.indexOf('chance') >= 0) g.appendChild(numberField(ck + '/chance', 'Chance of a child', 'AuthoredConsequence', 'chance', c, {min: 0, max: 1}));
      if (used.indexOf('item') >= 0) g.appendChild(textField(ck + '/item', 'Item given', 'AuthoredConsequence', 'item', c, {mono: true, placeholder: 'wine'}));
      if (used.indexOf('count') >= 0) g.appendChild(numberField(ck + '/count', 'How many', 'AuthoredConsequence', 'count', c, {min: 1, max: 200}));
      if (used.indexOf('amount') >= 0) g.appendChild(numberField(ck + '/amount', 'By how much', 'AuthoredConsequence', 'amount', c, {min: -100, max: 100}));
      g.appendChild(flagsField(ck + '/if', 'Only if', 'AuthoredConsequence', 'if', c, {placeholder: 'always'}));
      var body = [g];
      if (used.indexOf('text') >= 0) body.push(textField(ck + '/text', grudge ? 'The cause, in their words' : 'What they remember', 'AuthoredConsequence', 'text', c, {multiline: true, short: true, wide: true}));
      if (used.indexOf('summary') >= 0) body.push(textField(ck + '/summary', 'The news', 'AuthoredConsequence', 'summary', c, {multiline: true, short: true, wide: true}));
      return {title: c.type === 'memory' ? 'A memory for ' + (c.who || '...') : c.type === 'world_event' ? 'News: ' + (c.summary || '...') : (c.type || '(no type)'), chip: c.type, body: body};
    }, function () { return {type: 'memory', who: 'locals_of:{village}', text: ''}; }, 'Add a consequence');
  }

    var st = h('ul.outline');
    stages().forEach(function (s, i) {
      st.appendChild(outlineItem('stage', (s && s.id) || '(no id)', i === 0 ? 'the request' : (s && s.objective ? objectiveSummary(s.objective) : arr(s && s.choices).length + (arr(s && s.choices).length === 1 ? ' choice' : ' choices')),
        {kind: 'stage', index: i}, state.sel.kind === 'stage' && state.sel.index === i, 'stage:' + i, kindLetter(s),
        [iconButton('up', 'Move up', function () { moveStage(i, -1); }, {disabled: i === 0}), iconButton('down', 'Move down', function () { moveStage(i, 1); }, {disabled: i === stages().length - 1})]));
    });
    side.appendChild(st);

    side.appendChild(h('div.side-title', 'Endings', iconButton('plus', 'Add a named ending', addEnding)));
    var en = h('ul.outline');
    en.appendChild(outlineItem('reward', 'reward', 'the single success ending', {kind: 'reward'}, state.sel.kind === 'reward', 'reward', '\u2713'));
    Object.keys(endings()).forEach(function (k) {
      en.appendChild(outlineItem('ending', k, 'end:' + k, {kind: 'ending', name: k}, state.sel.kind === 'ending' && state.sel.name === k, 'ending:' + k, 'E'));
    });
    en.appendChild(outlineItem('failure', 'failure', t.failure && t.failure.days ? 'after ' + t.failure.days + ' days' : 'no time limit', {kind: 'failure'}, state.sel.kind === 'failure', 'failure', '\u23f1'));
    side.appendChild(en);
    var flagNames = collectFlags();
    if (flagNames.length) {
      side.appendChild(h('div.side-title', 'Flags'));
      side.appendChild(h('div.chips', {style: 'padding: 0 8px'}, flagNames.map(function (f) { return h('span.chip', f); })));
    }
  }

  function collectFlags() {
    var names = [];
    function add(list) { [].concat(list === undefined || list === null ? [] : list).forEach(function (f) { var n = String(f).replace(/^!+/, '').trim(); if (n && names.indexOf(n) < 0) names.push(n); }); }
    stages().forEach(function (s) {
      if (!s) return;
      arr(s.choices).forEach(function (c) { if (c) { add(c.sets); add(c.if); } });
      var sc = s.objective && s.objective.scene;
      if (sc) { arr(sc.findings).forEach(function (f) { if (f) add(f.sets); }); arr(sc.encounters).forEach(function (e) { if (e) add(e.sets); }); }
    });
    return names;
  }

  function renderChecks() {
    var box = $('checks');
    box.textContent = '';
    if (!state.doc && state.raw === null) {
      box.appendChild(h('div.side-title', 'Checks'));
      box.appendChild(h('p.empty-note', 'The game\'s own checks appear here, live, as you write.'));
      return;
    }
    var mine = state.problems;
    var blocking = mine.filter(function (p) { return p.blocking; }), cosmetic = mine.filter(function (p) { return !p.blocking; });
    box.appendChild(h('div.side-title', 'Checks', h('span', {style: 'text-transform:none;letter-spacing:0;font-weight:500'}, 'the game\'s own')));
    if (blocking.length) box.appendChild(h('div.verdict.bad', h('strong', 'The game would refuse this file'), h('span', blocking.length + ' blocking problem' + (blocking.length > 1 ? 's' : '') + (cosmetic.length ? ', and ' + cosmetic.length + ' more to look at.' : '.'))));
    else if (cosmetic.length) box.appendChild(h('div.verdict.warn', h('strong', 'The game would load it'), h('span', cosmetic.length + ' thing' + (cosmetic.length > 1 ? 's' : '') + ' to look at, which the game would only report.')));
    else box.appendChild(h('div.verdict.ok', h('strong', 'The game would load it as it is'), h('span', 'Nothing to report.')));

    if (state.notes) {
      box.appendChild(h('div.notes', h('h3', icon('info'), 'Import notes', h('span.spacer'), iconButton('close', 'Dismiss the notes', function () { state.notes = null; renderChecks(); })),
        h('p.help', {style: 'margin:0 0 6px'}, 'From ' + state.notes.from + '. What the import could not map, or had to choose:'),
        h('ul', state.notes.lines.map(function (n) { return h('li', n); }))));
    }

    function group(title, items, cls) {
      if (!items.length) return;
      var g = h('div.problem-group', h('h3', title, h('span.badge', {class: cls}, items.length)));
      items.forEach(function (p) {
        g.appendChild(h('button.problem', {type: 'button', class: cls, on: {click: function () { if (state.doc) goTo(p); else highlightRaw(p); }}},
          h('span.where', where(p)), p.message));
      });
      box.appendChild(g);
    }
    group('Blocking: the tale is not loaded', blocking, 'blocking');
    group('To look at: the tale still loads', cosmetic, 'cosmetic');
  }

  function where(p) {
    if (!state.doc) return 'the file';
    var t = state.doc.tales[p.tale >= 0 ? p.tale : state.tale] || {};
    var prefix = state.doc.tales.length > 1 ? (t.title || t.id) + ' / ' : '', m;
    if ((m = /^stage:(\d+)(?:\/choice:(\d+))?/.exec(p.key))) {
      var s = (t.stages || [])[parseInt(m[1], 10)] || {};
      var c = m[2] !== undefined ? arr(s.choices)[parseInt(m[2], 10)] : null;
      return prefix + 'stage ' + (s.id || '?') + (c ? ' / choice ' + (c.id || '?') : '');
    }
    if ((m = /^ending:([^/]*)/.exec(p.key))) return prefix + 'ending ' + m[1];
    if (/^reward/.test(p.key)) return prefix + 'reward';
    if (/^failure/.test(p.key)) return prefix + 'failure';
    return prefix + 'the tale';
  }

  function highlightRaw(p) { var ta = document.querySelector('.raw-edit textarea'); if (ta) ta.focus(); }

  function renderMain() {
    pending = [];
    var body = $('tabBody');
    body.textContent = '';
    var tabs = $('tabs');
    tabs.textContent = '';
    if (!state.doc && state.raw === null) { body.appendChild(welcome()); tabs.style.display = 'none'; return; }
    tabs.style.display = '';
    if (!state.doc) {
      tabs.appendChild(h('button.tab.active', {type: 'button'}, 'Mend the file'));
      body.appendChild(rawEditor(state.raw, 'The game cannot read this file: it is not valid JSON as the game reads it (see the check on the right). Mend it here, then read it again.'));
      return;
    }
    [['edit', 'Edit'], ['map', 'Story map'], ['json', 'JSON']].forEach(function (t) {
      tabs.appendChild(h('button.tab', {type: 'button', role: 'tab', 'aria-selected': state.tab === t[0] ? 'true' : 'false', class: state.tab === t[0] ? 'active' : null,
        on: {click: function () { state.tab = t[0]; if (t[0] === 'map') view.fitted = false; render(); }}}, t[1]));
    });
    if (state.tab === 'map') { body.style.overflow = 'hidden'; body.appendChild(mapTab()); return; }
    body.style.overflow = '';
    if (state.tab === 'json') {
      var text = docText();
      tabs.appendChild(h('div.tab-tools',
        h('button.btn.small', {type: 'button', on: {click: function () { copy(text); }}}, icon('copy'), 'Copy'),
        h('button.btn.small', {type: 'button', on: {click: function () { state.tab = 'text'; render(); }}}, 'Edit as text')));
      body.appendChild(h('pre.json-view', text));
      return;
    }
    if (state.tab === 'text') {
      tabs.appendChild(h('div.tab-tools', h('button.btn.small', {type: 'button', on: {click: function () { state.tab = 'json'; render(); }}}, 'Back')));
      body.appendChild(rawEditor(docText(), 'The file as text. Change anything, then read it again: the forms and the checks follow.'));
      return;
    }
    var sel = state.sel, ed;
    if (sel.kind === 'stage' && stages()[sel.index] !== undefined) ed = stageEditor(sel.index);
    else if (sel.kind === 'ending' && endings().hasOwnProperty(sel.name)) ed = outcomeEditor('ending', sel.name);
    else if (sel.kind === 'reward') ed = outcomeEditor('reward');
    else if (sel.kind === 'failure') ed = outcomeEditor('failure');
    else { state.sel = {kind: 'tale'}; ed = taleEditor(); }
    body.appendChild(ed);
    wireRenames(ed);
  }

  /** A stage's id, once edited and left, carries every path that led to the old one along with it. */
  function wireRenames(ed) {
    if (state.sel.kind !== 'stage') return;
    var s = stages()[state.sel.index];
    var input = ed.querySelector('[data-key="stage:' + state.sel.index + '/id"] input');
    if (!input || !s) return;
    var before = s.id;
    input.addEventListener('focus', function () { before = s.id; });
    input.addEventListener('change', function () {
      var now = s.id;
      if (blank(before) || now === before) return;
      var others = stages().filter(function (x) { return x !== s && x && x.id === before; }).length;
      if (others) return;
      var count = 0;
      forEachNext(function (holder, k) { if (holder[k] === before) { holder[k] = now; count++; } });
      if (count) { toast(count + ' path' + (count > 1 ? 's' : '') + ' now lead' + (count > 1 ? '' : 's') + ' to \u2018' + now + '\u2019.'); render(); }
      before = now;
    });
  }

  function rawEditor(text, intro) {
    var ta = h('textarea', {spellcheck: 'false', 'aria-label': 'The file as text'});
    ta.value = text;
    ta.addEventListener('input', function () { if (!state.doc) { state.raw = ta.value; scheduleChecks(); } });
    return h('div.raw-edit', h('p.help', {style: 'margin:0'}, intro), ta,
      h('div.toolbar', h('button.btn.primary', {type: 'button', on: {click: function () {
        var doc;
        try { doc = V.toDocument(ta.value); }
        catch (e) { if (e instanceof V.ReadError) { toast('The game still cannot read it: ' + e.message, 'error'); if (!state.doc) { state.raw = ta.value; check(); } return; } throw e; }
        if (!doc.tales.length) { toast('The text holds no tale.', 'error'); return; }
        if (state.doc) snapshot();
        var keepName = state.fileName;
        state.doc = doc; state.raw = null; state.fileName = keepName; state.tab = 'edit'; state.tale = Math.min(state.tale, doc.tales.length - 1); state.dirty = true;
        render();
        toast('Read again.');
      }}}, 'Read it again')));
  }

  function copy(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast('Copied.'); }, function () { toast('Could not copy.', 'error'); });
  }

  function welcome() {
    var draft = null;
    try { draft = JSON.parse(recall(DRAFT_KEY) || 'null'); } catch (e) { draft = null; }
    function startCard(glyph, title, text, onClick) {
      return h('button.start', {type: 'button', on: {click: onClick}}, h('span.glyph', glyph), h('strong', title), h('span', text));
    }
    return h('div.welcome',
      h('h1', 'Write a tale for Calradia Remembers'),
      h('p.lead', 'A tale is a quest in stages: offered by a character, told to the people who know of it, and checked by the game at every step. It can branch: a stage may offer choices, and the story ends one of several ways. You write the story; the game decides what counts.'),
      h('div.starts',
        startCard('+', 'A blank tale', 'One stage and a reward, ready to grow.', function () { start({tales: [blankTale()], asList: false}, null, null); }),
        startCard('W', 'From the werewolf', 'The tale that ships with the mod: watch, a scene in the wood, a band to hunt.', function () { start(V.toDocument(WEREWOLF), 'wolf_of_the_wood.json', null); }),
        startCard('\u21e7', 'Open a quest file', 'A .json file with one tale or a list of them.', openQuest),
        startCard('~', 'Import a Twine story', 'A published Twine 2 story (.html) or a Twee file (.twee).', function () { $('twineFile').click(); }),
        draft ? startCard('\u21ba', 'Your last session', (draft.fileName || 'an unsaved tale') + ', kept in this browser.', function () { start(V.toDocument(draft.text), draft.fileName, null); state.dirty = true; renderTop(); }) : null),
      h('p.drop-hint', 'You can also drop a file anywhere on this page. Nothing leaves your computer: the editor works offline and saves only the file you ask it to.'));
  }

  function render() {
    renderTop();
    renderSidebar();
    renderMain();
    check();
  }

  // ================================================================================================================
  // Wiring
  // ================================================================================================================

  function applyTheme(theme) {
    if (theme) document.documentElement.setAttribute('data-theme', theme); else document.documentElement.removeAttribute('data-theme');
    var dark = theme ? theme === 'dark' : !window.matchMedia('(prefers-color-scheme: light)').matches;
    var btn = $('themeBtn');
    btn.textContent = '';
    btn.appendChild(icon(dark ? 'sun' : 'moon'));
    btn.title = dark ? 'Use the light theme' : 'Use the dark theme';
  }

  function wire() {
    $('newBtn').addEventListener('click', function (e) { e.stopPropagation(); var m = $('newMenu'); m.hidden = !m.hidden; });
    document.addEventListener('click', function () { $('newMenu').hidden = true; });
    $('newBlank').addEventListener('click', function () { if (confirmLeave()) start({tales: [blankTale()], asList: false}, null, null); });
    $('newWolf').addEventListener('click', function () { if (confirmLeave()) start(V.toDocument(WEREWOLF), 'wolf_of_the_wood.json', null); });
    $('openBtn').addEventListener('click', openQuest);
    $('twineBtn').addEventListener('click', function () { if (confirmLeave()) $('twineFile').click(); });
    $('openFile').addEventListener('change', function (e) { var f = e.target.files[0]; if (f) openChosen(f); e.target.value = ''; });
    $('twineFile').addEventListener('change', function (e) { var f = e.target.files[0]; if (f) readFile(f, importTwine); e.target.value = ''; });
    $('saveBtn').addEventListener('click', save);
    $('undoBtn').addEventListener('click', undo);
    $('redoBtn').addEventListener('click', redo);
    $('themeBtn').addEventListener('click', function () {
      var current = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      var next = current === 'dark' ? 'light' : 'dark';
      store(THEME_KEY, next);
      applyTheme(next);
    });
    applyTheme(recall(THEME_KEY));

    document.addEventListener('keydown', function (e) {
      var mod = e.ctrlKey || e.metaKey;
      if (!mod) return;
      var k = e.key.toLowerCase();
      var typing = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
      if (k === 's') { e.preventDefault(); save(); }
      else if (k === 'o') { e.preventDefault(); openQuest(); }
      else if (k === 'z' && !e.shiftKey && !typing) { e.preventDefault(); undo(); }
      else if ((k === 'y' || (k === 'z' && e.shiftKey)) && !typing) { e.preventDefault(); redo(); }
    });

    var overlay = $('dropOverlay'), depth = 0;
    document.addEventListener('dragenter', function (e) { if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') >= 0) { depth++; overlay.classList.add('on'); } });
    document.addEventListener('dragleave', function () { depth = Math.max(0, depth - 1); if (!depth) overlay.classList.remove('on'); });
    document.addEventListener('dragover', function (e) { e.preventDefault(); });
    document.addEventListener('drop', function (e) {
      e.preventDefault(); depth = 0; overlay.classList.remove('on');
      var f = e.dataTransfer.files && e.dataTransfer.files[0];
      // The handle must be asked for while the drop is still being handled; the browser forgets the items after.
      var item = e.dataTransfer.items && e.dataTransfer.items[0];
      var asked = item && item.kind === 'file' && item.getAsFileSystemHandle ? item.getAsFileSystemHandle() : null;
      if (!f || !confirmLeave()) return;
      if (!asked) { openChosen(f); return; }
      asked.then(function (handle) { openChosen(f, handle && handle.kind === 'file' ? handle : null); }, function () { openChosen(f); });
    });
    window.addEventListener('beforeunload', function (e) { if (state.dirty) { e.preventDefault(); e.returnValue = ''; } });
    window.addEventListener('resize', debounce(function () { if (state.tab === 'map') renderMap(); }, 150));
    window.addEventListener('mousemove', mapMouseMove);
    window.addEventListener('mouseup', mapMouseUp);
  }

  function confirmLeave() {
    return !state.dirty || confirm('The tale has changes you have not saved. Leave them? (Your last session stays in this browser.)');
  }

  wire();
  render();
})();
</script>
</body>
</html>
