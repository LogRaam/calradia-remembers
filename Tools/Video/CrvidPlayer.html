<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRVID Player</title>
<!--
  Code written by Gabriel Mailhot, 25/10/2026.
  Gabriel (25/10/2026): "J'aimerais avoir un player pour visionner les videos." Plays Calradia Remembers' own videos (.crvid:
  a stored zip of JPEG frames and a manifest, made by Tools/Video/make_crvid.py, read in game by Video/CrvidDecoder.cs) in
  the browser, with no install and nothing sent anywhere: open files or a whole folder, or drop them on the page. The frames
  are decoded a few ahead of the one shown, so a 600-frame clip never sits whole in memory.
  Recompress (Gabriel, 27/10/2026, a .crvid four times the size of its .mp4: "je ferais le 2 pour garder le max de
  qualite [...] on peut en fait mettre une option de recompression avec un niveau de SSIM a partir du player"): each frame
  is re-encoded at the LOWEST JPEG quality whose SSIM against the frame as it stands still reaches the chosen level, so
  the SSIM sets how much quality may go, frame by frame; a frame that would not shrink keeps its own bytes. SSIM here is
  measured on luma (BT.601), with a 7x7 box window over integral images (fast; Wang et al.'s constants K1 0.01, K2 0.03).
  Measured on the_door (27/10/2026): recompressing a .crvid's own JPEG frames saves little (7% at 0.990, 20% at 0.980),
  since the reference is already a JPEG. Gabriel the same day: "glisser un .mp4 dans le player devrait le convertir en
  crvid": a video (.mp4, .webm, .mov) opened or dropped here is converted frame by frame from its SOURCE, each frame at the
  lowest JPEG quality that keeps the SSIM level against that source frame, fitted inside 768x1152 at 30 fps, then saved
  and added to the list.
  Calibrated on the_door the same day: this SSIM is strict on fine grain, and the clip's q3 frames reach only 0.9625 against
  the source (lowest 0.956), so 0.990 would be HEAVIER than today. Encoded from the source (estimated with libjpeg): 0.970
  10.2 MB, 0.960 8.3 MB (today's quality, 35% less than its 12.7 MB), 0.950 7.1 MB, 0.940 6.2 MB. Default 0.960.
-->
<style>
  :root { --bg:#16181d; --panel:#1f2229; --line:#2e323c; --text:#e6e8ee; --dim:#9aa1b2; --accent:#d9a441; --sel:#2b3140; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, Segoe UI, sans-serif; }
  body { display:flex; }
  #side { width:300px; min-width:240px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; }
  #side header { padding:12px; border-bottom:1px solid var(--line); }
  #side h1 { font-size:15px; margin:0 0 8px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; }
  button, select, label.btn { background:#2a2e37; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font:inherit; cursor:pointer; }
  button:hover, label.btn:hover { border-color:var(--accent); }
  button.on { background:var(--accent); color:#111; border-color:var(--accent); }
  #list { flex:1; overflow:auto; margin:0; padding:0; list-style:none; }
  #list li { padding:8px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
  #list li.cur { background:var(--sel); border-left:3px solid var(--accent); padding-left:9px; }
  #list .n { font-weight:600; word-break:break-all; }
  #list .m { color:var(--dim); font-size:12px; }
  #main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #stage { flex:1; display:flex; align-items:center; justify-content:center; min-height:0; position:relative; }
  #view { max-width:100%; max-height:100%; background:#000; }
  #hint { position:absolute; color:var(--dim); text-align:center; padding:20px; }
  #bar { border-top:1px solid var(--line); background:var(--panel); padding:10px 12px; }
  #seek { width:100%; }
  #ssim { width:72px; }
  .info { color:var(--dim); font-size:12px; margin-left:auto; align-self:center; }
  body.drag #stage { outline:2px dashed var(--accent); outline-offset:-8px; }
  input[type=file] { display:none; }
</style>
</head>
<body>
<aside id="side">
  <header>
    <h1>CRVID Player</h1>
    <div class="row">
      <label class="btn">Open videos<input id="files" type="file" accept=".crvid,.mp4,.webm,.mov,video/*" multiple></label>
      <label class="btn">Open a folder<input id="folder" type="file" webkitdirectory></label>
    </div>
  </header>
  <ul id="list"></ul>
</aside>
<main id="main">
  <div id="stage">
    <canvas id="view" width="2" height="2"></canvas>
    <div id="hint">Open .crvid files or a folder, or drop them here. A dropped .mp4 is converted to .crvid at the SSIM level below.<br>Space: play / pause. Left / Right: a frame. Up / Down: the previous / next video. L: loop.</div>
  </div>
  <div id="bar">
    <input id="seek" type="range" min="0" max="0" value="0">
    <div class="row" style="margin-top:8px">
      <button id="prev" title="Previous video (Up)">&#9198;</button>
      <button id="play" title="Play / pause (Space)">&#9654;</button>
      <button id="stop" title="Back to the first frame">&#9632;</button>
      <button id="next" title="Next video (Down)">&#9197;</button>
      <button id="loop" title="Loop this video (L)">Loop</button>
      <button id="all" title="When a video ends, play the next one">Play all</button>
      <select id="speed" title="Speed">
        <option value="0.25">x0.25</option><option value="0.5">x0.5</option><option value="1" selected>x1</option>
        <option value="1.5">x1.5</option><option value="2">x2</option>
      </select>
      <label title="Lowest SSIM each recompressed frame must keep against the frame as it stands (luma, 7x7 box)">SSIM
        <input id="ssim" type="number" min="0.800" max="0.999" step="0.001" value="0.960"></label>
      <button id="recompress" title="Re-encode every frame at the lowest JPEG quality that keeps this SSIM, and save a new .crvid">Recompress</button>
      <span class="info" id="info">No video</span>
    </div>
  </div>
</main>
<script>
(function () {
  'use strict';

  // ---------- reading a .crvid (a zip, frames stored; a deflated entry is inflated by the browser) ----------
  function u16(v, o) { return v.getUint16(o, true); }
  function u32(v, o) { return v.getUint32(o, true); }

  async function readZip(file) {
    var buf = await file.arrayBuffer(), view = new DataView(buf), bytes = new Uint8Array(buf);
    var eocd = -1;
    for (var i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) if (u32(view, i) === 0x06054b50) { eocd = i; break; }
    if (eocd < 0) throw new Error('not a zip');
    var count = u16(view, eocd + 10), at = u32(view, eocd + 16), entries = {};
    var dec = new TextDecoder();
    for (var n = 0; n < count; n++) {
      if (u32(view, at) !== 0x02014b50) throw new Error('broken zip directory');
      var method = u16(view, at + 10), size = u32(view, at + 20), nameLen = u16(view, at + 28), extraLen = u16(view, at + 30),
          commentLen = u16(view, at + 32), local = u32(view, at + 42);
      var name = dec.decode(bytes.subarray(at + 46, at + 46 + nameLen));
      var dataAt = local + 30 + u16(view, local + 26) + u16(view, local + 28);
      entries[name] = {method: method, data: bytes.subarray(dataAt, dataAt + size)};
      at += 46 + nameLen + extraLen + commentLen;
    }
    return entries;
  }

  async function entryBytes(e) {
    if (e.method === 0) return e.data;
    if (e.method === 8) return new Uint8Array(await new Response(new Blob([e.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    throw new Error('unknown zip method ' + e.method);
  }

  async function openCrvid(file) {
    var entries = await readZip(file);
    var m = entries['manifest.json'];
    if (!m) throw new Error('no manifest.json');
    var manifest = JSON.parse(new TextDecoder().decode(await entryBytes(m)));
    var frameNames = Object.keys(entries).filter(function (k) { return /^frames\/.+\.jpe?g$/i.test(k); }).sort();
    var frames = frameNames.map(function (k) { return entries[k]; });
    if (!frames.length) throw new Error('no frame');
    return {name: file.name, size: file.size, manifest: manifest, frames: frames, frameNames: frameNames, fps: Number(manifest.fps) || 30};
  }

  // ---------- the list ----------
  var videos = [], cur = -1;
  var list = document.getElementById('list');

  function fmtTime(s) { s = Math.max(0, s); var m = Math.floor(s / 60); return m + ':' + ('0' + Math.floor(s % 60)).slice(-2); }
  function natural(a, b) { return a.name.localeCompare(b.name, undefined, {numeric: true, sensitivity: 'base'}); }

  async function addFiles(fileList) {
    var all = Array.prototype.slice.call(fileList);
    var sources = all.filter(function (f) { return /\.(mp4|webm|mov|m4v)$/i.test(f.name); });
    for (var s = 0; s < sources.length; s++) {
      try { all.push(await convertVideo(sources[s])); }
      catch (err) { info.textContent = 'Converting ' + sources[s].name + ' failed: ' + err.message; }
    }
    var picked = all.filter(function (f) { return /\.crvid$/i.test(f.name); });
    if (!picked.length) return;
    var added = [];
    for (var i = 0; i < picked.length; i++) {
      try { added.push(await openCrvid(picked[i])); }
      catch (err) { added.push({name: picked[i].name, error: err.message}); }
    }
    var first = videos.length;
    videos = videos.concat(added.sort(natural));
    renderList();
    if (cur < 0) select(first);
  }

  function renderList() {
    list.innerHTML = '';
    videos.forEach(function (v, i) {
      var li = document.createElement('li');
      if (i === cur) li.className = 'cur';
      var meta = v.error ? 'cannot be read: ' + v.error
        : v.frames.length + ' frames, ' + v.fps + ' fps, ' + fmtTime(v.frames.length / v.fps) + ', ' + (v.manifest.width || '?') + 'x' + (v.manifest.height || '?')
          + ', ' + (v.size / 1048576).toFixed(1) + ' MB' + (v.manifest.loop ? ', loops in game' : '');
      li.innerHTML = '<div class="n"></div><div class="m"></div>';
      li.children[0].textContent = v.name;
      li.children[1].textContent = meta;
      li.onclick = function () { select(i); };
      list.appendChild(li);
    });
  }

  // ---------- playing: frames decoded a little ahead, never all at once ----------
  var canvas = document.getElementById('view'), ctx = canvas.getContext('2d');
  var seek = document.getElementById('seek'), info = document.getElementById('info');
  var playBtn = document.getElementById('play'), loopBtn = document.getElementById('loop'), allBtn = document.getElementById('all');
  var speedSel = document.getElementById('speed');
  var AHEAD = 24;
  var cache = new Map(), frame = 0, playing = false, startedAt = 0, startFrame = 0, loop = false, playAll = false, token = 0;

  function video() { return cur >= 0 && !videos[cur].error ? videos[cur] : null; }

  function bitmap(i) {
    var v = video();
    if (!v || i < 0 || i >= v.frames.length) return null;
    if (!cache.has(i)) {
      var mine = token;
      cache.set(i, entryBytes(v.frames[i]).then(function (b) { return createImageBitmap(new Blob([b], {type: 'image/jpeg'})); })
        .then(function (bmp) { if (mine !== token) { bmp.close(); return null; } return bmp; }));
    }
    return cache.get(i);
  }

  function prune(around) {
    cache.forEach(function (p, i) {
      if (i < around - 2 || i > around + AHEAD + 2) { p.then(function (b) { if (b) b.close(); }); cache.delete(i); }
    });
    for (var k = around; k <= around + AHEAD; k++) bitmap(k);
  }

  async function show(i) {
    var v = video();
    if (!v) return;
    frame = Math.max(0, Math.min(v.frames.length - 1, i));
    prune(frame);
    var bmp = await bitmap(frame);
    if (!bmp || video() !== v) return;
    if (canvas.width !== bmp.width || canvas.height !== bmp.height) { canvas.width = bmp.width; canvas.height = bmp.height; }
    ctx.drawImage(bmp, 0, 0);
    seek.value = frame;
    info.textContent = v.name + '   frame ' + (frame + 1) + ' / ' + v.frames.length + '   ' + fmtTime(frame / v.fps) + ' / ' + fmtTime(v.frames.length / v.fps);
  }

  function clearCache() {
    token++;
    cache.forEach(function (p) { p.then(function (b) { if (b) b.close(); }); });
    cache.clear();
  }

  function select(i) {
    if (i < 0 || i >= videos.length) return;
    pause();
    clearCache();
    cur = i;
    renderList();
    var cur_li = list.children[i];
    if (cur_li) cur_li.scrollIntoView({block: 'nearest'});
    document.getElementById('hint').style.display = 'none';
    var v = video();
    if (!v) { info.textContent = videos[i].name + ': ' + videos[i].error; return; }
    seek.max = v.frames.length - 1;
    loop = !!v.manifest.loop && loop;
    show(0);
  }

  function play() {
    var v = video();
    if (!v) return;
    if (frame >= v.frames.length - 1) frame = 0;
    playing = true;
    startedAt = performance.now();
    startFrame = frame;
    playBtn.innerHTML = '&#10074;&#10074;';
    requestAnimationFrame(tick);
  }

  function pause() { playing = false; playBtn.innerHTML = '&#9654;'; }

  var drawing = false;
  async function tick(now) {
    if (!playing) return;
    var v = video();
    if (!v) return pause();
    var speed = Number(speedSel.value) || 1;
    var target = startFrame + Math.floor((now - startedAt) / 1000 * v.fps * speed);
    if (target >= v.frames.length) {
      if (loop) { startedAt = now; startFrame = 0; target = 0; }
      else if (playAll && cur < videos.length - 1) { select(cur + 1); play(); return; }
      else { await show(v.frames.length - 1); return pause(); }
    }
    if (!drawing && target !== frame) {
      drawing = true;
      try { await show(target); } finally { drawing = false; }
    }
    requestAnimationFrame(tick);
  }

  function step(d) { pause(); show(frame + d); }

  // ---------- controls ----------
  playBtn.onclick = function () { playing ? pause() : play(); };
  document.getElementById('stop').onclick = function () { pause(); show(0); };
  document.getElementById('prev').onclick = function () { select(cur - 1); };
  document.getElementById('next').onclick = function () { select(cur + 1); };
  loopBtn.onclick = function () { loop = !loop; loopBtn.classList.toggle('on', loop); };
  allBtn.onclick = function () { playAll = !playAll; allBtn.classList.toggle('on', playAll); };
  speedSel.onchange = function () { if (playing) { startedAt = performance.now(); startFrame = frame; } };
  seek.oninput = function () { var was = playing; pause(); show(Number(seek.value)).then(function () { if (was) play(); }); };
  document.getElementById('files').onchange = function (e) { addFiles(e.target.files); e.target.value = ''; };
  document.getElementById('folder').onchange = function (e) { addFiles(e.target.files); e.target.value = ''; };

  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    else if (e.code === 'ArrowRight') { e.preventDefault(); step(1); }
    else if (e.code === 'ArrowLeft') { e.preventDefault(); step(-1); }
    else if (e.code === 'ArrowDown') { e.preventDefault(); select(cur + 1); }
    else if (e.code === 'ArrowUp') { e.preventDefault(); select(cur - 1); }
    else if (e.code === 'KeyL') loopBtn.onclick();
    else if (e.code === 'Home') { pause(); show(0); }
  });

  // ---------- recompressing to an SSIM level ----------
  // Luma of an RGBA image, BT.601.
  function luma(rgba, n) {
    var y = new Float64Array(n);
    for (var i = 0, j = 0; i < n; i++, j += 4) y[i] = 0.299 * rgba[j] + 0.587 * rgba[j + 1] + 0.114 * rgba[j + 2];
    return y;
  }

  // Integral image (one extra row and column of zeros) of v, or of v*w when w is given.
  function integral(v, w, width, height) {
    var s = new Float64Array((width + 1) * (height + 1));
    for (var y = 0; y < height; y++) {
      var row = 0;
      for (var x = 0; x < width; x++) {
        var k = y * width + x;
        row += w ? v[k] * w[k] : v[k];
        s[(y + 1) * (width + 1) + x + 1] = s[y * (width + 1) + x + 1] + row;
      }
    }
    return s;
  }

  // The reference's sums, computed once per frame.
  function reference(rgba, width, height) {
    var y = luma(rgba, width * height);
    return {y: y, s: integral(y, null, width, height), ss: integral(y, y, width, height), width: width, height: height};
  }

  // Mean SSIM of a candidate against the reference, 7x7 box windows at every position.
  function ssim(ref, rgba) {
    var W = ref.width, H = ref.height, R = 7, N = R * R, C1 = Math.pow(0.01 * 255, 2), C2 = Math.pow(0.03 * 255, 2);
    var y = luma(rgba, W * H), s = integral(y, null, W, H), ss = integral(y, y, W, H), sxy = integral(ref.y, y, W, H);
    function box(t, x0, y0) { var a = W + 1; return t[(y0 + R) * a + x0 + R] - t[y0 * a + x0 + R] - t[(y0 + R) * a + x0] + t[y0 * a + x0]; }
    var total = 0, count = 0;
    for (var y0 = 0; y0 + R <= H; y0++)
      for (var x0 = 0; x0 + R <= W; x0++) {
        var mx = box(ref.s, x0, y0) / N, my = box(s, x0, y0) / N;
        var vx = box(ref.ss, x0, y0) / N - mx * mx, vy = box(ss, x0, y0) / N - my * my, cxy = box(sxy, x0, y0) / N - mx * my;
        total += ((2 * mx * my + C1) * (2 * cxy + C2)) / ((mx * mx + my * my + C1) * (vx + vy + C2));
        count++;
      }
    return count ? total / count : 1;
  }

  var work = document.createElement('canvas'), wctx = work.getContext('2d', {willReadFrequently: true});
  function pixels(bmp) { wctx.drawImage(bmp, 0, 0); return wctx.getImageData(0, 0, work.width, work.height).data; }
  function encode(q) { return new Promise(function (ok) { work.toBlob(ok, 'image/jpeg', q); }); }

  // The smallest JPEG of the picture now on the work canvas whose SSIM against it still reaches the level (the best
  // quality tried when none does). Each candidate is decoded onto a scratch canvas, so the work canvas keeps the source.
  var probe = document.createElement('canvas'), pctx = probe.getContext('2d', {willReadFrequently: true});
  async function smallestAtLevel(level) {
    var W = work.width, H = work.height;
    if (probe.width !== W || probe.height !== H) { probe.width = W; probe.height = H; }
    var ref = reference(wctx.getImageData(0, 0, W, H).data, W, H);
    var lo = 0.10, hi = 1.0, best = null, bestSsim = 0;
    for (var step = 0; step < 7; step++) {
      var q = (lo + hi) / 2;
      var blob = await encode(q);
      var cand = await createImageBitmap(blob);
      pctx.drawImage(cand, 0, 0);
      cand.close();
      var score = ssim(ref, pctx.getImageData(0, 0, W, H).data);
      if (score >= level) { best = blob; bestSsim = score; hi = q; } else lo = q;
    }
    if (!best) { best = await encode(1.0); bestSsim = 0; }
    return {blob: best, ssim: bestSsim};
  }

  // A .crvid frame recompressed to the level, or its own bytes when nothing smaller keeps it.
  async function recompressFrame(bytes, level) {
    var bmp = await createImageBitmap(new Blob([bytes], {type: 'image/jpeg'}));
    if (work.width !== bmp.width || work.height !== bmp.height) { work.width = bmp.width; work.height = bmp.height; }
    wctx.drawImage(bmp, 0, 0);
    bmp.close();
    var r = await smallestAtLevel(level);
    if (r.ssim < level || r.blob.size >= bytes.length) return {bytes: bytes, ssim: 1, kept: true};
    return {bytes: new Uint8Array(await r.blob.arrayBuffer()), ssim: r.ssim, kept: false};
  }

  // ---------- converting a video (.mp4, .webm, .mov) to .crvid, from its source frames ----------
  var MAX_W = 768, MAX_H = 1152, CONVERT_FPS = 30;
  function once(el, ev) { return new Promise(function (ok, ko) { el.addEventListener(ev, ok, {once: true}); el.addEventListener('error', function () { ko(new Error('the browser cannot read this video')); }, {once: true}); }); }

  async function convertVideo(file) {
    var level = Math.min(0.999, Math.max(0.8, Number(document.getElementById('ssim').value) || 0.96));
    var url = URL.createObjectURL(file), el = document.createElement('video');
    el.muted = true; el.preload = 'auto'; el.src = url;
    try {
      await once(el, 'loadeddata');
      var scale = Math.min(1, MAX_W / el.videoWidth, MAX_H / el.videoHeight);
      var W = Math.max(2, Math.floor(el.videoWidth * scale / 2) * 2), H = Math.max(2, Math.floor(el.videoHeight * scale / 2) * 2);
      work.width = W; work.height = H;
      wctx.imageSmoothingQuality = 'high';
      var count = Math.max(1, Math.floor(el.duration * CONVERT_FPS));
      var files = [], total = 0, sum = 0, worst = 1;
      for (var i = 0; i < count; i++) {
        el.currentTime = Math.min(el.duration, (i + 0.5) / CONVERT_FPS);
        await once(el, 'seeked');
        wctx.drawImage(el, 0, 0, W, H);
        var r = await smallestAtLevel(level);
        var bytes = new Uint8Array(await r.blob.arrayBuffer());
        total += bytes.length; sum += r.ssim; worst = Math.min(worst, r.ssim);
        files.push({name: 'frames/' + ('00000' + (i + 1)).slice(-6) + '.jpg', data: bytes});
        info.textContent = 'Converting ' + file.name + ' at SSIM ' + level.toFixed(3) + ': frame ' + (i + 1) + ' / ' + count;
      }
      var manifest = {version: 1, fps: CONVERT_FPS, width: W, height: H, frames: count, loop: false};
      files.unshift({name: 'manifest.json', data: new TextEncoder().encode(JSON.stringify(manifest, null, 2))});
      var out = storedZip(files), name = file.name.replace(/\.[^.]+$/, '') + '.crvid';
      var a = document.createElement('a');
      a.href = URL.createObjectURL(out); a.download = name; a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 10000);
      info.textContent = file.name + ' (' + (file.size / 1048576).toFixed(1) + ' MB) -> ' + name + ' (' + (out.size / 1048576).toFixed(1) + ' MB), '
        + count + ' frames ' + W + 'x' + H + ' at ' + CONVERT_FPS + ' fps, mean SSIM ' + (sum / count).toFixed(4) + ', lowest ' + worst.toFixed(4) + '.';
      return new File([out], name);
    } finally { URL.revokeObjectURL(url); }
  }

  // A stored zip, as the game reads it (no compression: a JPEG does not shrink further).
  var CRC = (function () { var t = new Uint32Array(256); for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(b) { var c = 0xFFFFFFFF; for (var i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  function storedZip(files) {
    var enc = new TextEncoder(), parts = [], dir = [], offset = 0;
    files.forEach(function (f) {
      var name = enc.encode(f.name), crc = crc32(f.data), h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint32(14, crc, true);
      h.setUint32(18, f.data.length, true); h.setUint32(22, f.data.length, true); h.setUint16(26, name.length, true);
      parts.push(new Uint8Array(h.buffer), name, f.data);
      var d = new DataView(new ArrayBuffer(46));
      d.setUint32(0, 0x02014b50, true); d.setUint16(4, 20, true); d.setUint16(6, 20, true); d.setUint32(16, crc, true);
      d.setUint32(20, f.data.length, true); d.setUint32(24, f.data.length, true); d.setUint16(28, name.length, true); d.setUint32(42, offset, true);
      dir.push(new Uint8Array(d.buffer), name);
      offset += 30 + name.length + f.data.length;
    });
    var dirSize = dir.reduce(function (n, p) { return n + p.length; }, 0), e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
    e.setUint32(12, dirSize, true); e.setUint32(16, offset, true);
    return new Blob(parts.concat(dir, [new Uint8Array(e.buffer)]), {type: 'application/octet-stream'});
  }

  var recompressing = false;
  document.getElementById('recompress').onclick = async function () {
    var v = video();
    if (!v || recompressing) return;
    var level = Math.min(0.999, Math.max(0.8, Number(document.getElementById('ssim').value) || 0.96));
    recompressing = true;
    pause();
    var files = [{name: 'manifest.json', data: new TextEncoder().encode(JSON.stringify(v.manifest, null, 2))}];
    var before = 0, after = 0, kept = 0, sum = 0, worst = 1;
    try {
      for (var i = 0; i < v.frames.length; i++) {
        var bytes = await entryBytes(v.frames[i]);
        var r = await recompressFrame(bytes, level);
        before += bytes.length; after += r.bytes.length; if (r.kept) kept++;
        sum += r.ssim; worst = Math.min(worst, r.ssim);
        files.push({name: v.frameNames[i], data: r.bytes});
        info.textContent = 'Recompressing ' + v.name + ' at SSIM ' + level.toFixed(3) + ': frame ' + (i + 1) + ' / ' + v.frames.length
          + ', ' + Math.round(100 - after / before * 100) + '% smaller so far';
      }
      var out = storedZip(files), a = document.createElement('a');
      a.href = URL.createObjectURL(out);
      a.download = v.name.replace(/\.crvid$/i, '') + '.ssim' + level.toFixed(3).slice(2) + '.crvid';
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 10000);
      info.textContent = v.name + ': ' + (v.size / 1048576).toFixed(1) + ' MB -> ' + (out.size / 1048576).toFixed(1) + ' MB ('
        + Math.round(100 - out.size / v.size * 100) + '% smaller), mean SSIM ' + (sum / v.frames.length).toFixed(4) + ', lowest '
        + worst.toFixed(4) + (kept ? ', ' + kept + ' frame(s) kept as they were' : '') + '. Saved as ' + a.download + '.';
    } catch (err) { info.textContent = 'Recompression failed: ' + err.message; }
    finally { recompressing = false; }
  };

  ['dragenter', 'dragover'].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); document.body.classList.add('drag'); }); });
  ['dragleave', 'drop'].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); document.body.classList.remove('drag'); }); });
  document.addEventListener('drop', function (e) { if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files); });
})();
</script>
</body>
</html>
